<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<meta name="theme-color" content="#160726" />
<title>Erica's Birthday Quiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700;800;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg1:#1c0b33; --bg2:#0a0416; --card:#271246; --card-hi:#3a1c66;
    --line:#4d2c85; --text:#f4ecff; --muted:#bfa3e6;
    --gold:#ffcf3f; --magenta:#ff3fa4; --cyan:#45e6d4; --green:#61e690; --violet:#b98bff;
    --arcane:#a35cff; --jade:#39f2ac; --hot:#ff4da6;
    --fdisp:'Orbitron','Rajdhani','Segoe UI',system-ui,sans-serif;
    --fbody:'Rajdhani','Segoe UI',system-ui,-apple-system,BlinkMacSystemFont,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    font-family:var(--fbody);
    background:radial-gradient(130% 90% at 50% 0%, var(--bg1) 0%, var(--bg2) 72%);
    color:var(--text); line-height:1.45; overflow-x:hidden;
    font-size:16px;
  }
  #app{min-height:100%;}
  h1,h2,h3{margin:0 0 12px;line-height:1.15;font-family:var(--fdisp);letter-spacing:.02em;}
  p{margin:0 0 14px;}
  .muted{color:var(--muted);}
  .center{text-align:center;}

  /* ============ CONTROLLER (phone) ============ */
  .ctrl{max-width:480px;margin:0 auto;padding:20px 18px 44px;display:flex;flex-direction:column;min-height:100vh;min-height:100dvh;}
  .ctrl h1{font-size:1.6rem;letter-spacing:-.4px;}
  .ctrl h2{font-size:1.25rem;}
  .tag{display:inline-block;font-family:var(--fdisp);font-size:.72rem;font-weight:800;text-transform:uppercase;letter-spacing:2px;
    padding:5px 12px;border-radius:999px;background:rgba(255,63,164,.16);color:var(--magenta);border:1px solid rgba(255,63,164,.4);}
  .btn{display:block;width:100%;border:none;border-radius:14px;padding:17px 18px;font-size:1.04rem;font-weight:700;
    font-family:var(--fdisp);letter-spacing:.04em;text-transform:uppercase;color:#1a0b2e;
    background:linear-gradient(135deg,var(--gold),#ffe487);cursor:pointer;margin-top:12px;
    box-shadow:0 6px 20px rgba(255,207,63,.25);}
  .btn:active{transform:translateY(1px);}
  .btn.secondary{background:transparent;color:var(--text);border:1.5px solid var(--line);box-shadow:none;}
  .btn.ghost{background:var(--card);color:var(--muted);box-shadow:none;font-weight:700;font-size:.92rem;padding:12px;}
  .btn:disabled{opacity:.38;cursor:default;}
  .opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:1.5px solid var(--line);
    background:var(--card);color:var(--text);border-radius:14px;padding:15px 16px;font-size:1.01rem;font-family:inherit;
    font-weight:500;cursor:pointer;margin-bottom:11px;line-height:1.35;}
  .opt:active{transform:translateY(1px);}
  .opt.selected{border-color:var(--gold);background:var(--card-hi);box-shadow:0 0 0 2px rgba(255,207,63,.4) inset;}
  .opt .rankmark{flex:none;font-size:1.35rem;width:34px;text-align:center;}
  .card{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:18px;margin-bottom:14px;}
  .prompt{font-family:var(--fdisp);font-size:1.3rem;font-weight:700;margin:14px 0 18px;line-height:1.3;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:.78rem;text-transform:uppercase;letter-spacing:1px;color:var(--muted);
    margin-bottom:6px;font-weight:800;}
  .field input,.field textarea,textarea.answer{width:100%;padding:14px;border-radius:12px;border:1.5px solid var(--line);
    background:var(--bg2);color:var(--text);font-size:1.05rem;font-family:inherit;}
  textarea.answer{min-height:110px;resize:none;line-height:1.4;}
  .field input:focus,textarea.answer:focus{outline:2px solid var(--gold);border-color:var(--gold);}
  .charcount{font-size:.8rem;color:var(--muted);text-align:right;margin-top:4px;}
  .pill-row{display:flex;gap:8px;}
  .pill-row button{flex:1;padding:12px 0;border-radius:12px;border:1.5px solid var(--line);background:var(--card);
    color:var(--text);font-weight:800;font-family:inherit;font-size:1rem;cursor:pointer;}
  .pill-row button.active{background:var(--gold);color:#1a0b2e;border-color:var(--gold);}
  .grow{flex:1;}
  .handoff{text-align:center;padding:26px 0;}
  .handoff .emoji{font-size:3.6rem;margin-bottom:6px;}
  .handoff .big{font-size:2rem;font-weight:900;margin:8px 0 2px;color:var(--gold);}
  .progress{font-size:.8rem;color:var(--muted);letter-spacing:1.5px;text-transform:uppercase;font-weight:800;margin-bottom:6px;}
  .scoreline{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-radius:12px;
    background:var(--card);border:1.5px solid var(--line);margin-bottom:9px;font-weight:700;}
  .scoreline .pts{font-weight:900;color:var(--gold);font-size:1.1rem;}
  .scoreline.leader{border-color:var(--gold);background:var(--card-hi);}
  .ans-card{padding:13px 15px;border-radius:12px;border:1.5px solid var(--line);margin-bottom:10px;background:var(--card);}
  .ans-card .txt{font-weight:600;}
  .ans-card .meta{font-size:.84rem;color:var(--cyan);margin-top:6px;font-weight:800;}
  .ans-card .meta .p{color:var(--gold);}
  .footer-note{font-size:.78rem;color:var(--muted);text-align:center;margin-top:20px;}
  details{margin-top:14px;} summary{cursor:pointer;color:var(--muted);font-weight:800;font-size:.9rem;}
  details p{font-size:.9rem;color:var(--muted);margin-top:10px;}
  .status-dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--muted);margin-right:7px;vertical-align:middle;}
  .status-dot.on{background:var(--green);box-shadow:0 0 8px var(--green);}
  .qrbox{background:#fff;border-radius:16px;padding:16px;max-width:340px;margin:14px auto;}
  .qrbox svg{display:block;width:100%;height:auto;}
  .pairbtn{display:block;width:100%;max-width:340px;margin:10px auto 0;border:1.5px solid var(--line);
    background:var(--card);color:var(--text);border-radius:12px;padding:13px 16px;font-weight:800;font-size:1rem;
    font-family:inherit;cursor:pointer;}
  .pairbtn.go{background:linear-gradient(135deg,var(--gold),#ffe487);color:#1a0b2e;border:none;}
  .step{font-size:.8rem;font-weight:900;letter-spacing:2px;text-transform:uppercase;color:var(--cyan);margin:4px 0 2px;}
  video.scan{width:100%;max-width:340px;border-radius:16px;margin:12px auto;display:block;background:#000;border:2px solid var(--line);}
  textarea.code{width:100%;min-height:90px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg2);
    color:var(--text);font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.8rem;padding:10px;}

  /* ============ BIG SCREEN — K-Pop × Azeroth ============ */
  .screen{position:fixed;inset:0;overflow:hidden;background:
    radial-gradient(60% 50% at 20% 0%, rgba(255,63,164,.2), transparent 60%),
    radial-gradient(60% 50% at 85% 10%, rgba(57,242,172,.14), transparent 60%),
    radial-gradient(50% 45% at 50% 100%, rgba(163,92,255,.22), transparent 70%),
    radial-gradient(130% 90% at 50% 0%, var(--bg1) 0%, var(--bg2) 75%);}
  .screen::before{content:"";position:absolute;left:50%;top:-30vh;width:120vw;height:120vw;transform:translateX(-50%);
    background:conic-gradient(from 0deg, transparent 0 8%, rgba(255,77,166,.10) 10% 14%, transparent 16% 30%,
      rgba(57,242,172,.09) 32% 36%, transparent 38% 55%, rgba(163,92,255,.11) 57% 62%, transparent 64% 82%,
      rgba(255,207,63,.08) 84% 88%, transparent 90% 100%);
    animation:sweep 40s linear infinite;z-index:1;pointer-events:none;}
  @keyframes sweep{to{transform:translateX(-50%) rotate(360deg);}}
  .screen .stage{position:absolute;inset:0;display:flex;flex-direction:column;padding:3.5vh 4vw 3vh;}
  .blob{position:absolute;border-radius:50%;filter:blur(40px);opacity:.3;animation:drift 18s ease-in-out infinite;}
  @keyframes drift{0%,100%{transform:translate(0,0) scale(1);}50%{transform:translate(4vw,3vh) scale(1.15);}}
  .screen .body{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;z-index:2;min-height:0;overflow:hidden;padding-bottom:1vh;}
  .screen .cat{font-family:var(--fdisp);font-size:1.5vw;font-weight:800;letter-spacing:4px;text-transform:uppercase;color:var(--magenta);margin-bottom:1.2vh;text-shadow:0 0 20px rgba(255,63,164,.5);}
  .screen .q{font-family:var(--fdisp);font-size:2.9vw;font-weight:800;max-width:84vw;line-height:1.22;margin-bottom:2.6vh;text-wrap:balance;}
  .screen .answers{display:grid;grid-template-columns:1fr 1fr;gap:1.6vh 2vw;width:80vw;max-width:1150px;}
  .screen .acard{position:relative;background:var(--card);border:2px solid var(--line);border-radius:16px;
    padding:2vh 1.8vw;font-size:1.7vw;font-weight:700;text-align:left;line-height:1.3;min-height:11vh;
    display:flex;align-items:center;gap:1vw;transition:transform .4s,border-color .4s,background .4s,box-shadow .4s;}
  .screen .acard .slot{flex:none;width:3vw;height:3vw;min-width:32px;min-height:32px;border-radius:9px;display:grid;
    place-items:center;font-weight:900;background:rgba(255,255,255,.08);color:var(--muted);font-size:1.5vw;}
  .screen .acard .medal{position:absolute;top:-1.6vh;right:-1vw;font-size:2.6vw;opacity:0;transform:scale(0) rotate(-20deg);
    transition:opacity .45s,transform .45s cubic-bezier(.2,1.5,.4,1);}
  .screen .acard.ranked{border-color:var(--gold);}
  .screen .acard.ranked .medal{opacity:1;transform:scale(1) rotate(-8deg);}
  .screen .acard .author{position:absolute;bottom:-1.4vh;left:1.4vw;font-size:1.05vw;font-weight:900;padding:.4vh 1vw;
    border-radius:999px;background:var(--cyan);color:#06231f;opacity:0;transform:translateY(.6vh);transition:opacity .4s,transform .4s;white-space:nowrap;}
  .screen .acard.shown .author{opacity:1;transform:none;}
  .screen .acard.mine .author{background:var(--magenta);color:#2a0016;}
  .screen .acard .gain{position:absolute;top:-1.4vh;left:1.4vw;font-size:1.5vw;font-weight:900;color:var(--green);opacity:0;}
  .screen .acard .gain.go{animation:gain 1.6s ease-out forwards;}
  @keyframes gain{0%{opacity:0;transform:translateY(1vh);}20%{opacity:1;}100%{opacity:0;transform:translateY(-3vh);}}

  /* ---- the little stage show (characters while people wait) ---- */
  .showstage{position:relative;width:92vw;max-width:1400px;height:26vh;margin-top:2vh;pointer-events:none;}
  .showstage .floor{position:absolute;left:0;right:0;bottom:2.5vh;height:2px;
    background:linear-gradient(90deg,transparent,rgba(163,92,255,.5),rgba(255,63,164,.5),transparent);}
  .showstage .spot{position:absolute;bottom:1vh;width:15vh;height:4vh;border-radius:50%;transform:translateX(-50%);
    background:radial-gradient(closest-side,rgba(255,255,255,.16),transparent);}
  .showstage .char{position:absolute;bottom:2vh;height:23vh;width:auto;overflow:visible;
    filter:drop-shadow(0 6px 10px rgba(0,0,0,.5));}
  .showstage .mage{left:6%;animation:sBob 2.6s ease-in-out infinite;}
  .showstage .orc{left:42%;transform:translateX(-50%);animation:sBob 3.1s ease-in-out infinite;height:21vh;}
  .showstage .idol{right:6%;animation:sStep .82s ease-in-out infinite alternate;}
  .showstage .mage .orb{transform-origin:center;animation:sPulse 1.5s ease-in-out infinite;}
  .showstage .mage .cast{animation:sCast 2.2s ease-out infinite;}
  .showstage .idol .arm{transform-origin:64px 98px;animation:sWave .82s ease-in-out infinite alternate;}
  .showstage .orc .axe{transform-origin:22px 108px;animation:sChop 1.7s ease-in-out infinite;}
  .showstage .dragon{position:absolute;bottom:52%;left:0;width:15vh;height:auto;animation:sFly 16s linear infinite;
    filter:drop-shadow(0 4px 10px rgba(0,0,0,.5));}
  .showstage .dragon .wing{transform-origin:56px 42px;animation:sFlap .24s ease-in-out infinite alternate;}
  .showstage .note,.showstage .spark{position:absolute;opacity:0;font-weight:900;}
  .showstage .note{color:var(--hot);font-size:3vh;text-shadow:0 0 12px var(--hot);animation:sRise 3.4s ease-in infinite;}
  .showstage .spark{width:1.3vh;height:1.3vh;background:var(--gold);border-radius:2px;
    box-shadow:0 0 10px var(--gold);animation:sRise 3s ease-in infinite;}
  @keyframes sBob{50%{transform:translateY(-1.8vh) rotate(-2deg);}}
  .showstage .orc{animation-name:sBobOrc;}
  @keyframes sBobOrc{50%{transform:translateX(-50%) translateY(-1.4vh) rotate(2deg);}}
  @keyframes sStep{0%{transform:translateX(-.6vw) rotate(-5deg);}100%{transform:translateX(.6vw) rotate(5deg);}}
  @keyframes sWave{0%{transform:rotate(-20deg);}100%{transform:rotate(14deg);}}
  @keyframes sChop{0%,55%{transform:rotate(-12deg);}72%{transform:rotate(34deg);}100%{transform:rotate(-12deg);}}
  @keyframes sPulse{50%{transform:scale(1.3);filter:brightness(1.6);}}
  @keyframes sCast{0%,70%{opacity:0;transform:translate(0,0) scale(.3);}80%{opacity:1;}100%{opacity:0;transform:translate(14px,-34px) scale(1.1);}}
  @keyframes sFlap{0%{transform:rotate(-4deg);}100%{transform:rotate(-44deg);}}
  @keyframes sFly{0%{transform:translateX(-18vh) translateY(0) scaleX(1);}
    46%{transform:translateX(94vw) translateY(-4vh) scaleX(1);}54%{transform:translateX(94vw) translateY(-4vh) scaleX(-1);}
    100%{transform:translateX(-18vh) translateY(2vh) scaleX(-1);}}
  @keyframes sRise{0%{opacity:0;transform:translateY(0) rotate(0);}15%{opacity:1;}100%{opacity:0;transform:translateY(-14vh) rotate(160deg);}}

  .screen .pods{display:flex;gap:1.4vw;justify-content:center;align-items:flex-end;z-index:2;padding-top:2.4vh;}
  .pod{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:1.6vh 1.6vw;min-width:11vw;
    text-align:center;transition:transform .35s,border-color .35s,box-shadow .35s;position:relative;}
  .pod .av{font-size:2.6vw;}
  .pod .nm{font-family:var(--fdisp);font-weight:700;font-size:1.4vw;margin-top:.3vh;letter-spacing:1px;text-transform:uppercase;}
  .pod .sc{font-family:var(--fdisp);font-weight:900;font-size:2.2vw;color:var(--gold);}
  .pod.active{border-color:var(--cyan);transform:translateY(-1.4vh) scale(1.04);box-shadow:0 0 34px rgba(69,230,212,.45);}
  .pod.locked{border-color:var(--green);}
  .pod.judge{border-color:var(--magenta);}
  .pod .stamp{position:absolute;top:-1.2vh;right:-1vw;background:var(--green);color:#06210f;font-weight:900;
    font-size:1vw;padding:.4vh .9vw;border-radius:999px;transform:rotate(8deg) scale(0);transition:transform .3s;}
  .pod.locked .stamp{transform:rotate(8deg) scale(1);}

  .screen .roundword{font-family:var(--fdisp);font-size:2.4vw;font-weight:800;letter-spacing:6px;text-transform:uppercase;color:var(--muted);}
  .screen .huge{font-family:var(--fdisp);font-size:8.4vw;font-weight:900;letter-spacing:0;
    text-shadow:0 0 40px rgba(163,92,255,.6),0 0 12px rgba(255,63,164,.5);}
  .pop{animation:pop .5s cubic-bezier(.2,1.4,.4,1) both;}
  @keyframes pop{from{transform:scale(.6);opacity:0;}to{transform:scale(1);opacity:1;}}
  .fade{animation:fade .5s ease both;}
  @keyframes fade{from{opacity:0;transform:translateY(1.5vh);}to{opacity:1;transform:none;}}
  .pair-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;z-index:2;position:relative;text-align:center;}
  .pair-wrap .qrbox{max-width:min(56vh,480px);}
  .pair-wrap .pairbtn{max-width:min(56vh,480px);font-size:1.3vw;padding:1.4vh 1vw;}
  .pair-wrap .step{font-size:1.1vw;}
  .pair-wrap h1{font-size:3.6vw;}
  .pair-wrap p{font-size:1.6vw;color:var(--muted);max-width:64vw;}
  .pair-code{font-family:var(--fdisp)!important;text-shadow:0 0 40px rgba(255,207,63,.55),0 0 14px rgba(255,63,164,.5);}
  .bigscoreboard{width:70vw;max-width:1000px;}
  .bar{display:flex;align-items:center;gap:1.5vw;margin-bottom:1.8vh;font-weight:900;font-family:var(--fdisp);}
  .bar .lbl{width:13vw;text-align:right;font-size:1.6vw;text-transform:uppercase;letter-spacing:1px;}
  .bar .track{flex:1;height:3.4vh;background:var(--card);border-radius:999px;overflow:hidden;border:2px solid var(--line);}
  .bar .fill{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--magenta),var(--gold));width:0;transition:width 1.1s cubic-bezier(.2,.8,.2,1);}
  .bar .val{width:5vw;font-size:2vw;color:var(--gold);}
  .crown{font-size:8vw;}
  .happy{font-family:var(--fdisp);font-size:3.4vw;font-weight:900;letter-spacing:.04em;
    background:linear-gradient(90deg,var(--gold),var(--hot),var(--jade),var(--arcane));
    -webkit-background-clip:text;background-clip:text;color:transparent;}

  .confetti{position:fixed;top:-14px;width:12px;height:16px;z-index:99;pointer-events:none;border-radius:2px;}
  @keyframes fall{to{transform:translateY(112vh) rotate(720deg);}}
  .toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--card);border:1.5px solid var(--line);
    color:var(--text);padding:10px 16px;border-radius:12px;font-weight:700;font-size:.9rem;z-index:120;}
  .mutebtn{position:fixed;top:12px;right:14px;z-index:120;background:rgba(0,0,0,.35);border:1px solid var(--line);
    color:var(--text);border-radius:10px;padding:8px 12px;font-weight:800;cursor:pointer;font-size:1.1rem;}
</style>
</head>
<body>
<div id="app"></div>
<script src="vendor/mqtt.min.js"></script>
<script>
(function () {
  "use strict";

  /* ================================================================
     PROMPTS  —  open-ended. Players type an answer; Erica ranks them.
     Edit / add freely. "{E}" is replaced with the judge's name,
     "{F}" with the first guesser's name.
  ================================================================ */
  var PROMPTS = [
    { cat: "Origin Story",    q: "{E}'s villain origin story: it all started when ___" },
    { cat: "Naming Things",   q: "What {E} would name her guild, her band, or her firstborn: ___" },
    { cat: "The Lie",         q: "The lie {E} tells more than any other: ___" },
    { cat: "Entrance Music",  q: "{E}'s pro-wrestling entrance song, and why it fits: ___" },
    { cat: "Roman Empire",    q: "The thing {E} thinks about constantly for no reason: ___" },
    { cat: "Buried With",     q: "The one item that absolutely must be buried with {E}: ___" },
    { cat: "The Usual",       q: "{E}'s sushi order, described as dramatically as possible: ___" },
    { cat: "Game Design",     q: "One rule {E} would add to World of Warcraft: ___" },
    { cat: "Spirit Animal",   q: "{E}'s spirit animal, plus its one defining behaviour: ___" },
    { cat: "Instagram",       q: "The reel {E} sends the group chat with zero context and no caption: ___" },
    { cat: "Leverage",        q: "{F}'s most reliable trick for getting {E} to leave the house: ___" },
    { cat: "Forbidden Magic", q: "A spell {E} desperately wishes were real: ___" },
    { cat: "Text History",    q: "The single most {E} text message of all time: ___" },
    { cat: "New Holiday",     q: "A national holiday that should exist purely for {E}: ___" },
    { cat: "Collectible",     q: "If {E} were a limited-edition figurine, the accessory it comes with is ___" },
    { cat: "Nordic Noir",     q: "The plot of the Norwegian crime drama {E} is currently obsessed with: ___" },
    { cat: "Memoir",          q: "The title of {E}'s autobiography would be ___" },
    { cat: "Backstage Rider", q: "One demand on {E}'s backstage rider before a metal show: ___" },
    { cat: "2 A.M.",          q: "{E}'s search history at 2 a.m.: ___" },
    { cat: "Spin It",         q: "{E}'s worst trait — but phrased as a strength on a résumé: ___" },
    { cat: "Sleep Schedule",  q: "It's 4 a.m. and {E} is still very much awake. What is she doing? ___" },
    { cat: "Famous Last Words", q: "{E}'s actual last words will probably be ___" },
    { cat: "Group Chat",      q: "The group chat would completely fall apart without {E} because ___" },
    { cat: "Perfect Friday",  q: "How {E} would describe her perfect Friday night to a total stranger: ___" }
  ];

  var RANK_PTS = [3, 2, 1, 0];      // points for having Erica's #1 / #2 / #3 / #4 answer
  var MEDALS = ["🥇", "🥈", "🥉", "4️⃣"];
  var AV_GUESS = ["⚔️", "🎤", "💜"];
  var AV_JUDGE = "🐉";
  var SAVE_KEY = "erica-bday-quiz-v3";
  var MAXLEN = 140;

  var app = document.getElementById("app");

  /* ============================ helpers ============================ */
  function el(tag, props, kids) {
    var n = document.createElement(tag);
    if (props) Object.keys(props).forEach(function (k) {
      if (k === "class") n.className = props[k];
      else if (k === "html") n.innerHTML = props[k];
      else if (k === "text") n.textContent = props[k];
      else if (k.slice(0, 2) === "on") n.addEventListener(k.slice(2), props[k]);

  /* ============================================================
     LINK  — the phone and the Big Screen meet in a room named by a
     6-character code, via a free public MQTT broker. Tiny JSON
     messages only; once connected nothing else touches the broker
     except game state. Falls through a list of brokers.
  ============================================================ */
  var BROKERS = [
    "wss://broker.emqx.io:8084/mqtt",
    "wss://test.mosquitto.org:8081/mqtt",
    "wss://broker.hivemq.com:8884/mqtt"
  ];
  function Link() {
    this.onopen = null;      // peer handshake complete
    this.onmessage = null;   // {t:'vm', vm:...}
    this.onclose = null;     // broker connection lost (may auto-recover)
    this.onfail = null;      // could not reach any broker
    this.client = null; this.role = null; this.code = null;
    this._peer = false; this._brokerOk = false; this._lastTx = null;
  }
  Link.prototype._rx = function () { return "ebq/" + this.code + "/" + (this.role === "screen" ? "c" : "s"); };
  Link.prototype._tx = function () { return "ebq/" + this.code + "/" + (this.role === "screen" ? "s" : "c"); };
  Link.prototype._pub = function (obj, retain) {
    if (!this.client || !this.client.connected) return;
    try { this.client.publish(this._tx(), JSON.stringify(obj), { qos: 1, retain: !!retain }); } catch (e) {}
  };
  Link.prototype.send = function (obj) {
    if (obj && obj.t === "vm") this._lastTx = obj;
    this._pub(obj, obj && obj.t === "vm");        // retain latest game state for late joiners
  };
  Link.prototype.clearRetained = function () {
    if (this.client && this.client.connected) { try { this.client.publish(this._tx(), "", { qos: 1, retain: true }); } catch (e) {} }
    this._lastTx = null;
  };
  Link.prototype.host = function (code) { this.role = "screen"; this.code = code; this._connect(0); };
  Link.prototype.join = function (code) { this.role = "controller"; this.code = code; this._connect(0); };
  Link.prototype._connect = function (bi) {
    var self = this;
    if (bi >= BROKERS.length) { if (self.onfail) self.onfail(); return; }
    var cid = "ebq_" + Math.random().toString(16).slice(2, 10);
    var c;
    try { c = mqtt.connect(BROKERS[bi], { clientId: cid, keepalive: 30, reconnectPeriod: 4000, connectTimeout: 7000, clean: true }); }
    catch (e) { return self._connect(bi + 1); }
    self.client = c;
    var everConnected = false;
    c.on("connect", function () {
      everConnected = true; self._brokerOk = true;
      c.subscribe(self._rx(), { qos: 1 });
      // announce presence, and keep announcing until the peer answers
      var tries = 0;
      function announce() {
        if (self._peer || !self.client || !self.client.connected) return;
        self._pub({ t: self.role === "controller" ? "hello" : "here" });
        if (++tries < 40) setTimeout(announce, 2500);
      }
      announce();
      if (self._peer && self._lastTx) self._pub(self._lastTx, true);
    });
    c.on("message", function (topic, payload) {
      var m; try { m = JSON.parse(payload.toString()); } catch (e) { return; }
      if (!m || !m.t) return;
      if (m.t === "hello" && self.role === "screen") { self._pub({ t: "welcome" }); self._markPeer(); }
      else if (m.t === "welcome" && self.role === "controller") { self._markPeer(); }
      else if (m.t === "here" && self.role === "controller") { self._pub({ t: "hello" }); }

  /* ============================================================

    var connected = false;

    function loadState() { try { return JSON.parse(localStorage.getItem(SAVE_KEY)); } catch (e) { return null; } }

    /* ---------- helpers ---------- */

          ? "Tap them best → worst  (" + ranking.length + "/4)"
          : "Tap a numbered answer to clear it.";
        S.data.ranking = ranking.slice(); saveState(); sendVM();
      }
      list = el("div", {}, pool.map(function (txt, di) {
        return el("button", { class: "opt", onclick: function () {
          var pos = ranking.indexOf(di);
          if (pos !== -1) ranking.splice(pos, 1);
          else if (ranking.length < 4) ranking.push(di);
          paint();
        }}, [el("span", { class: "rankmark" }), el("span", { text: txt })]);
      }));
      hint = el("p", { class: "muted" });
      btn = el("button", { class: "btn", disabled: "disabled", onclick: function () {
        S.data.ranking = ranking.slice(); go("reveal");
      }}, ["Reveal 🎉"]);
      render(el("div", { class: "ctrl" }, [
        el("div", { class: "progress", text: judgeName() + " ranks the four answers" }),
        el("div", { class: "prompt", text: p.q }),
        list, hint, btn
      ]));
      paint();
    }

    function slotOfGuesser(g) {
      // which display slot holds guesser g's answer
      for (var d = 0; d < 4; d++) if (S.data.answers[S.data.shuffle[d]].by === g) return d;
      return -1;
    }
    function roundPoints(g) {
      var d = slotOfGuesser(g);
      var pos = S.data.ranking.indexOf(d);
      var pts = pos === -1 ? 0 : RANK_PTS[pos];
      return { total: pts, pos: pos };
    }

    function cReveal() {
      var p = curPrompt();
      var results = [0, 1, 2].map(roundPoints);
      if (S.applied !== S.round) {
        results.forEach(function (r, i) { S.scores[i] += r.total; });
        S.applied = S.round; saveState();
      }
      sendVM();
      var kids = [
        el("div", { class: "progress center", text: "Round " + (S.round + 1) + " reveal" }),
        el("div", { class: "prompt center", text: p.q })
      ];
      S.data.shuffle.forEach(function (ai, d) {
        var a = S.data.answers[ai];
        var pos = S.data.ranking.indexOf(d);
        var who = a.by === 3 ? judgeName() + " (her own!)" : S.players[a.by];
        var pv = "";
        if (a.by !== 3) { var r = roundPoints(a.by); pv = "  ·  +" + r.total; }
        kids.push(el("div", { class: "ans-card" + (a.by === 3 ? "" : ""), style: a.by === 3 ? "border-color:var(--magenta)" : "" }, [
          el("div", { class: "txt", text: (pos !== -1 ? MEDALS[pos] + "  " : "") + "“" + a.text + "”" }),
          el("div", { class: "meta", html: "— " + esc(who) + "<span class='p'>" + pv + "</span>" })
        ]));
      });
      kids.push(el("h3", { style: "margin-top:20px", text: "Total" }));
      scoreboard(kids);
      var last = S.round >= S.order.length - 1;
      kids.push(el("button", { class: "btn", onclick: function () {
        if (last) { S.finished = true; go("end"); }
        else { S.round++; S.data = null; S.applied = -1; go("intro"); }
      }}, [last ? "See the final results 👑" : "Next round →"]));
      render(el("div", { class: "ctrl" }, kids));
    }

    function scoreboard(kids) {
      var ranked = [0, 1, 2].map(function (i) { return { i: i, s: S.scores[i] }; }).sort(function (a, b) { return b.s - a.s; });
      var top = ranked[0].s;
      ranked.forEach(function (r) {
        kids.push(el("div", { class: "scoreline" + (r.s === top && top > 0 ? " leader" : "") }, [
          el("span", { text: (r.s === top && top > 0 ? "👑 " : "") + S.players[r.i] }),
          el("span", { class: "pts", text: r.s })
        ]));
      });
    }

    function cEnd() {
      confetti(120);
      var ranked = [0, 1, 2].map(function (i) { return { i: i, s: S.scores[i] }; }).sort(function (a, b) { return b.s - a.s; });
      var winners = ranked.filter(function (r) { return r.s === ranked[0].s; });
      var title = winners.length > 1
        ? "Tie: " + winners.map(function (w) { return S.players[w.i]; }).join(" & ") + "!"
        : S.players[winners[0].i] + " knows Erica best!";
      var kids = [
        el("div", { class: "center", style: "font-size:3.4rem", text: "👑" }),
        el("h1", { class: "center", text: title }),
        el("h3", { class: "center", style: "color:var(--gold)", text: "Happy Birthday, " + judgeName() + "!" }),
        el("h3", { text: "Final scoreboard" })
      ];
      scoreboard(kids);
      kids.push(el("button", { class: "btn", onclick: function () { clearState(); location.search = ""; } }, ["Play again"]));
      render(el("div", { class: "ctrl" }, kids));
    }

    return { start: start };
  })();

  /* ============================================================
     BIG SCREEN
  ============================================================ */
  var Screen = (function () {
    var link = new Link();
    var lastKey = "";
    var code = null;
    var paired = false;

    function start() {
      document.body.dataset.role = "screen";
      muted = false; sfxInit();
      pairing();
    }

    function frame(children) {
      render(el("div", { class: "screen" }, [
        el("div", { class: "blob", style: "width:38vw;height:38vw;left:-8vw;top:-6vw;background:var(--magenta);" }),
        el("div", { class: "blob", style: "width:32vw;height:32vw;right:-6vw;top:4vh;background:var(--cyan);animation-delay:-6s;" }),
        el("div", { class: "blob", style: "width:30vw;height:30vw;left:30vw;bottom:-12vh;background:var(--violet);animation-delay:-11s;" }),
        el("button", { class: "mutebtn", onclick: function (e) { muted = !muted; e.target.textContent = muted ? "🔇" : "🔊"; if (!muted) sfxInit(); }, text: "🔊" }),
        el("div", { class: "stage" }, children)
      ]));
    }

    var gotAnyVM = false;
    function pairing() {
      if (!code) { try { code = cleanCode(sessionStorage.getItem("ebq_code")); } catch (e) {} }
      if (!code || code.length !== 6) code = makeCode();
      try { sessionStorage.setItem("ebq_code", code); } catch (e) {}
      if (/dev/.test(location.hash)) { window.__code = code; window.__link = link; }
      link.onopen = function () { paired = true; SFX.round(); if (!gotAnyVM) waitLobby(); };
      link.onmessage = onMessage;
      link.onclose = function () { if (!paired) showCode("Reconnecting to the relay…"); };
      link.onfail = function () { showCode("⚠ Can't reach the relay — check this device's internet, then reload."); };
      link.host(code);
      showCode(null);
    }
    function showCode(status) {
      frame([el("div", { class: "pair-wrap" }, [
        el("h1", { text: "🎂 Erica's Birthday Quiz" }),
        el("p", { style: "font-size:1.6vw;margin-bottom:1vh", text: "On the phone: open this page → tap “The Controller” → enter this code:" }),
        el("div", { class: "pair-code", style: "font-size:12vw;font-weight:900;letter-spacing:.14em;color:var(--gold);margin:1vh 0;", text: code }),
        el("p", { style: "font-size:1.4vw;color:var(--muted)", text: status || "Waiting for the phone to connect…" })
      ])]);
    }

    function waitLobby() {
      frame([el("div", { class: "body" }, [
        el("div", { class: "roundword pop", text: "Connected" }),
        el("div", { class: "q fade", text: "Waiting for the game to start on the phone…" }),
        el("div", { class: "cat fade", text: "📱 → 📺" })
      ])]);
    }

    function onMessage(m) { if (m.t === "vm") { gotAnyVM = true; applyVM(m.vm); } }
    if (/dev/.test(location.hash)) window.__applyVM = function (vm) { applyVM(vm); };

    /* ---- little stage show: SVG characters + CSS, no assets ---- */
    var SVG_MAGE =
      '<svg class="char mage" viewBox="0 0 120 172">' +
      '<line x1="95" y1="44" x2="95" y2="164" stroke="#8a5a34" stroke-width="7" stroke-linecap="round"/>' +
      '<circle class="orb" cx="95" cy="38" r="13" fill="#45e6d4"/>' +
      '<path class="cast" d="M95 38 l3 -9 3 9 9 3 -9 3 -3 9 -3 -9 -9 -3z" fill="#ffe487"/>' +
      '<path d="M26 164 Q33 96 60 92 Q87 96 94 164 Z" fill="#5b2ea6"/>' +
      '<path d="M40 120 l-16 10 M80 120 l14 -8" stroke="#5b2ea6" stroke-width="9" stroke-linecap="round"/>' +
      '<circle cx="60" cy="74" r="22" fill="#f2d3ba"/>' +
      '<path d="M44 78 q16 22 32 0 q-4 26 -16 26 q-12 0 -16 -26z" fill="#e9e3f2"/>' +
      '<path d="M30 68 L60 8 L90 68 Z" fill="#2e1550"/><circle cx="60" cy="9" r="5" fill="#ffcf3f"/>' +
      '<path d="M30 68 q30 14 60 0" stroke="#ffcf3f" stroke-width="4" fill="none"/>' +
      '<circle cx="52" cy="74" r="2.6" fill="#1a0b2e"/><circle cx="68" cy="74" r="2.6" fill="#1a0b2e"/>' +
      '</svg>';
    var SVG_IDOL =
      '<svg class="char idol" viewBox="0 0 130 172">' +
      '<rect x="54" y="128" width="8" height="30" rx="3" fill="#2a2440"/><rect x="70" y="128" width="8" height="30" rx="3" fill="#2a2440"/>' +
      '<path d="M40 130 Q46 84 65 82 Q84 84 90 130 Z" fill="#ff4da6"/>' +
      '<path d="M40 130 Q65 118 90 130 L90 138 Q65 126 40 138 Z" fill="#ff7bc0"/>' +
      '<g class="arm"><line x1="66" y1="96" x2="98" y2="66" stroke="#f2d3ba" stroke-width="8" stroke-linecap="round"/>' +
      '<circle cx="101" cy="61" r="8" fill="#3a3350"/><rect x="98" y="61" width="4" height="16" fill="#6a6390"/></g>' +
      '<line x1="60" y1="96" x2="40" y2="120" stroke="#f2d3ba" stroke-width="8" stroke-linecap="round"/>' +
      '<circle cx="65" cy="62" r="20" fill="#f2d3ba"/>' +
      '<path d="M45 58 q-14 22 -6 46 q10 -4 12 -18z" fill="#4a2c3f"/>' +
      '<path d="M85 58 q14 22 6 46 q-10 -4 -12 -18z" fill="#4a2c3f"/>' +
      '<path d="M44 52 Q65 26 86 52 L86 44 Q65 22 44 44 Z" fill="#4a2c3f"/>' +
      '<circle cx="58" cy="62" r="2.6" fill="#1a0b2e"/><circle cx="72" cy="62" r="2.6" fill="#1a0b2e"/>' +
      '<path d="M60 70 q5 5 10 0" stroke="#c23b7a" stroke-width="2.4" fill="none" stroke-linecap="round"/>' +
      '</svg>';
    var SVG_ORC =
      '<svg class="char orc" viewBox="0 0 130 168">' +
      '<path d="M34 160 Q40 104 65 100 Q90 104 96 160 Z" fill="#3a3a52"/>' +
      '<g class="axe"><line x1="30" y1="120" x2="14" y2="70" stroke="#7a4a2a" stroke-width="7" stroke-linecap="round"/>' +
      '<path d="M4 70 q22 -16 26 4 q-16 12 -26 -4z" fill="#c9d1d9"/></g>' +
      '<line x1="92" y1="112" x2="104" y2="128" stroke="#3f8f4f" stroke-width="10" stroke-linecap="round"/>' +
      '<circle cx="65" cy="70" r="26" fill="#3f8f4f"/>' +
      '<path d="M52 84 l-4 12 6 -3z M78 84 l4 12 -6 -3z" fill="#f2f2f2"/>' +
      '<path d="M40 58 q10 -8 18 0 M72 58 q10 -8 18 0" stroke="#1c3a22" stroke-width="3" fill="none"/>' +
      '<circle cx="55" cy="66" r="3" fill="#ffcf3f"/><circle cx="77" cy="66" r="3" fill="#ffcf3f"/>' +
      '<path d="M42 40 q23 -14 46 0" stroke="#2b2b1e" stroke-width="6" fill="none"/>' +
      '</svg>';
    var SVG_DRAGON =
      '<svg class="dragon" viewBox="0 0 150 96">' +
      '<path d="M40 52 Q8 44 2 62 Q18 58 38 60 Z" fill="#2fd39a"/>' +
      '<ellipse cx="72" cy="52" rx="34" ry="17" fill="#39f2ac"/>' +
      '<path class="wing" d="M62 42 Q52 4 26 16 Q42 34 54 50 Z" fill="#8affd8"/>' +
      '<circle cx="108" cy="42" r="15" fill="#39f2ac"/>' +
      '<path d="M100 30 l-3 -10 6 6z M114 30 l3 -10 -6 6z" fill="#2fd39a"/>' +
      '<circle cx="113" cy="40" r="2.6" fill="#06231f"/>' +
      '<path d="M120 48 q8 2 12 -2" stroke="#06231f" stroke-width="2" fill="none"/>' +
      '</svg>';

    function showStage() {
      var s = el("div", { class: "showstage" });
      var html = '<div class="floor"></div>'
        + '<div class="spot" style="left:12%"></div><div class="spot" style="left:42%"></div><div class="spot" style="left:88%"></div>'
        + SVG_MAGE + SVG_ORC + SVG_IDOL + SVG_DRAGON;
      var deco = [
        ['note', '8%', '♪', 0], ['note', '88%', '♫', 1.6], ['note', '82%', '♪', 3.1], ['note', '4%', '♫', 2.2],
        ['spark', '16%', '', 0.8], ['spark', '10%', '', 2.4], ['spark', '92%', '', 1.2], ['spark', '40%', '', 1.8]
      ];
      deco.forEach(function (d) {
        html += '<span class="' + d[0] + '" style="left:' + d[1] + ';bottom:4vh;animation-delay:' + d[3] + 's">' + d[2] + '</span>';
      });
      s.innerHTML = html;
      return s;
    }

    function pods(vm, opts) {
      opts = opts || {};
      var row = el("div", { class: "pods" });
      var jp = el("div", { class: "pod judge" }, [
        el("div", { class: "av", text: AV_JUDGE }),
        el("div", { class: "nm", text: vm.names.judge }),
        el("div", { class: "sc", style: "font-size:1.4vw;color:var(--magenta)", text: "JUDGE" }),
        el("div", { class: "stamp", text: "DONE" })
      ]);
      if (opts.active === 3) jp.classList.add("active");
      if (opts.locked && opts.locked[3]) jp.classList.add("locked");
      var g = vm.names.guessers.map(function (nm, i) {
        var p = el("div", { class: "pod" }, [
          el("div", { class: "av", text: AV_GUESS[i] }),
          el("div", { class: "nm", text: nm }),
          el("div", { class: "sc", id: "sc" + i, text: vm.scores[i] }),
          el("div", { class: "stamp", text: "LOCKED" })
        ]);
        if (opts.locked && opts.locked[i]) p.classList.add("locked");
        if (opts.active === i) p.classList.add("active");
        return p;
      });
      row.appendChild(g[0]); row.appendChild(jp); row.appendChild(g[1]); row.appendChild(g[2]);
      row._guesserPods = g;
      return row;
    }

    function answerGrid(vm, opts) {
      opts = opts || {};
      var grid = el("div", { class: "answers" });
      (vm.pool || []).forEach(function (item, d) {
        var text = typeof item === "string" ? item : item.text;
        var card = el("div", { class: "acard" }, [
          el("div", { class: "slot", text: opts.hideSlot ? "" : (d + 1) }),
          el("div", { text: "“" + text + "”" }),
          el("div", { class: "medal" }),
          el("div", { class: "author" }),
          el("div", { class: "gain" })
        ]);
        grid.appendChild(card);
      });
      return grid;
    }

    function applyVM(vm) {
      var key = [vm.phase, vm.round, vm.active, (vm.locked || []).join(""), (vm.rankingSoFar || []).join("")].join("|");
      var changed = key !== lastKey; lastKey = key;

      if (vm.phase === "lobby") {
        if (!vm.names.guessers.length) return waitLobby();
        frame([
          el("div", { class: "body" }, [
            el("div", { class: "roundword pop", text: "⚔️  Get Ready  🎤" }),
            el("div", { class: "q fade", text: "How Well Do You Know " + vm.names.judge + "?" }),
            el("div", { class: "cat fade", style: "margin-top:1.5vh", text: "K-Pop × Azeroth Edition" })
          ]),
          pods(vm, {})
        ]);
        return;
      }
      if (vm.phase === "round-intro") {
        if (changed) SFX.round();
        frame([el("div", { class: "body" }, [
          el("div", { class: "roundword pop", text: "Round " + (vm.round + 1) + " / " + vm.total }),
          el("div", { class: "cat fade", style: "margin-top:2vh", text: vm.cat }),
          el("div", { class: "huge pop", style: "font-size:6vw;margin-top:1vh", text: "🎤⚔️" })
        ])]);
        return;
      }
      if (vm.phase === "typing") {
        var n = (vm.locked || []).filter(Boolean).length;
        var who = vm.active == null ? "All answers in"
          : (vm.active === 3 ? vm.names.judge : vm.names.guessers[vm.active]) + " is typing…";
        if (changed && n > 0) SFX.lock();
        frame([
          el("div", { class: "body", style: "flex:none;justify-content:flex-start;padding-top:6vh" }, [
            el("div", { class: "cat fade", text: vm.cat }),
            el("div", { class: "q fade", style: "font-size:2.5vw;margin-bottom:1.4vh", text: vm.q }),
            el("div", { class: "roundword fade", style: "font-size:1.9vw;color:var(--cyan)", text: who }),
            el("div", { class: "roundword fade", style: "margin-top:.6vh;font-size:1.4vw", text: n + " / 4 locked in" })
          ]),
          el("div", { style: "flex:1;position:relative;width:100%;display:flex;align-items:flex-end;justify-content:center;z-index:2;" }, [showStage()]),
          pods(vm, { active: vm.active, locked: vm.locked })
        ]);
        return;
      }
      if (vm.phase === "ranking") {
        var grid = answerGrid(vm, {});
        (vm.rankingSoFar || []).forEach(function (d, pos) {
          var c = grid.children[d];
          if (c) { c.classList.add("ranked"); c.querySelector(".medal").textContent = MEDALS[pos]; }
        });
        if (changed) SFX.turn();
        frame([
          el("div", { class: "body" }, [
            el("div", { class: "cat fade", text: vm.cat }),
            el("div", { class: "q fade", text: vm.q }),
            grid,
            el("div", { class: "roundword fade", style: "margin-top:2.4vh;font-size:1.8vw;color:var(--magenta)", text: "👑 " + vm.names.judge + " is ranking the answers…" })
          ]),
          pods(vm, { active: 3 })
        ]);
        return;
      }
      if (vm.phase === "reveal") { renderReveal(vm, changed); return; }
      if (vm.phase === "end") { renderEnd(vm); return; }
    }

    function renderReveal(vm, animate) {
      var podRow = pods(vm, {});
      var grid = answerGrid(vm, {});
      var caption = el("div", { class: "roundword fade", style: "margin-top:2.2vh;font-size:1.6vw;color:var(--cyan);text-transform:none;letter-spacing:1px", text: "" });
      frame([
        el("div", { class: "body" }, [
          el("div", { class: "cat fade", text: vm.cat }),
          el("div", { class: "q fade", text: vm.q }),
          grid, caption
        ]),
        podRow
      ]);
      var cards = grid.children;
      var prev = vm.prevScores || vm.scores;
      [0, 1, 2].forEach(function (i) { var e = podRow.querySelector("#sc" + i); if (e) e.textContent = prev[i]; });

      function slotOf(by) { for (var d = 0; d < vm.pool.length; d++) if (vm.pool[d].by === by) return d; return -1; }

      if (!animate) {
        vm.ranking.forEach(function (d, pos) { cards[d].classList.add("ranked"); cards[d].querySelector(".medal").textContent = MEDALS[pos]; });
        finishReveal();
        return;
      }
      SFX.reveal();
      // 1) medals appear #1 → #4
      vm.ranking.forEach(function (d, pos) {
        setTimeout(function () {
          cards[d].classList.add("ranked");
          cards[d].querySelector(".medal").textContent = MEDALS[pos];
          SFX.points();
        }, 700 + pos * 850);
      });
      // 2) reveal authors + points
      setTimeout(finishReveal, 700 + 4 * 850 + 400);

      function finishReveal() {
        vm.pool.forEach(function (item, d) {
          var card = cards[d];
          var isJudge = item.by === 3;
          var name = isJudge ? vm.names.judge + " — her own!" : vm.names.guessers[item.by];
          card.querySelector(".author").textContent = name;
          card.classList.add("shown");
          if (isJudge) card.classList.add("mine");
        });
        vm.roundPoints.forEach(function (rp, i) {
          var d = slotOf(i);
          if (d >= 0 && rp.total > 0) {
            var gain = cards[d].querySelector(".gain");
            gain.textContent = "+" + rp.total;
            gain.classList.add("go");
          }
          if (rp.total >= 3) confetti(18);
        });
        SFX.points();
        caption.textContent = vm.names.guessers.map(function (n, i) { return n + " +" + vm.roundPoints[i].total; }).join("    ·    ");
        setTimeout(function () {
          [0, 1, 2].forEach(function (i) { var e = podRow.querySelector("#sc" + i); if (e) e.textContent = vm.scores[i]; });
        }, 900);
      }
    }

    function renderEnd(vm) {
      SFX.win(); confetti(200);
      var ranked = [0, 1, 2].map(function (i) { return { i: i, s: vm.scores[i] }; }).sort(function (a, b) { return b.s - a.s; });
      var winners = ranked.filter(function (r) { return r.s === ranked[0].s; });
      var title = winners.length > 1
        ? "It's a tie!  " + winners.map(function (w) { return vm.names.guessers[w.i]; }).join(" & ")
        : vm.names.guessers[winners[0].i] + " knows Erica best!";
      var maxS = Math.max(1, ranked[0].s);
      var board = el("div", { class: "bigscoreboard" });
      ranked.forEach(function (r, k) {
        var fill = el("div", { class: "fill" });
        board.appendChild(el("div", { class: "bar" }, [
          el("div", { class: "lbl", text: (k === 0 && r.s > 0 ? "👑 " : "") + vm.names.guessers[r.i] }),
          el("div", { class: "track" }, [fill]),
          el("div", { class: "val", text: r.s })
        ]));
        setTimeout(function () { fill.style.width = (r.s / maxS * 100) + "%"; }, 300 + k * 250);
      });
      frame([el("div", { class: "body" }, [
        el("div", { class: "crown pop", text: "👑" }),
        el("div", { class: "huge pop", style: "font-size:4.6vw", text: title }),
        el("div", { class: "happy fade", style: "margin:1.5vh 0 3vh", text: "Happy Birthday, " + vm.names.judge + "!" }),
        board
      ])]);
    }

    return { start: start };
  })();

  boot();
})();
</script>
