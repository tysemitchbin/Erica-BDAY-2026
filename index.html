<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<meta name="theme-color" content="#160726" />
<title>Erica's Birthday Quiz</title>
<style>
  :root {
    --bg1:#1c0b33; --bg2:#0a0416; --card:#271246; --card-hi:#3a1c66;
    --line:#4d2c85; --text:#f4ecff; --muted:#b79ada;
    --gold:#ffcf3f; --magenta:#ff3fa4; --cyan:#45e6d4; --green:#61e690; --violet:#b98bff;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:radial-gradient(130% 90% at 50% 0%, var(--bg1) 0%, var(--bg2) 72%);
    color:var(--text); line-height:1.45; overflow-x:hidden;
  }
  #app{min-height:100%;}
  h1,h2,h3{margin:0 0 12px;line-height:1.15;}
  p{margin:0 0 14px;}
  .muted{color:var(--muted);}
  .center{text-align:center;}

  /* ============ CONTROLLER (phone) ============ */
  .ctrl{max-width:480px;margin:0 auto;padding:20px 18px 44px;display:flex;flex-direction:column;min-height:100vh;min-height:100dvh;}
  .ctrl h1{font-size:1.6rem;letter-spacing:-.4px;}
  .ctrl h2{font-size:1.25rem;}
  .tag{display:inline-block;font-size:.7rem;font-weight:800;text-transform:uppercase;letter-spacing:1.5px;
    padding:5px 12px;border-radius:999px;background:rgba(255,63,164,.16);color:var(--magenta);border:1px solid rgba(255,63,164,.4);}
  .btn{display:block;width:100%;border:none;border-radius:14px;padding:17px 18px;font-size:1.06rem;font-weight:800;
    font-family:inherit;color:#1a0b2e;background:linear-gradient(135deg,var(--gold),#ffe487);cursor:pointer;margin-top:12px;
    box-shadow:0 6px 20px rgba(255,207,63,.25);}
  .btn:active{transform:translateY(1px);}
  .btn.secondary{background:transparent;color:var(--text);border:1.5px solid var(--line);box-shadow:none;}
  .btn.ghost{background:var(--card);color:var(--muted);box-shadow:none;font-weight:700;font-size:.92rem;padding:12px;}
  .btn:disabled{opacity:.38;cursor:default;}
  .opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:1.5px solid var(--line);
    background:var(--card);color:var(--text);border-radius:14px;padding:15px 16px;font-size:1.01rem;font-family:inherit;
    font-weight:500;cursor:pointer;margin-bottom:11px;line-height:1.35;}
  .opt:active{transform:translateY(1px);}
  .opt.selected{border-color:var(--gold);background:var(--card-hi);box-shadow:0 0 0 2px rgba(255,207,63,.4) inset;}
  .opt .rankmark{flex:none;font-size:1.35rem;width:34px;text-align:center;}
  .card{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:18px;margin-bottom:14px;}
  .prompt{font-size:1.35rem;font-weight:800;margin:14px 0 18px;line-height:1.25;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:.78rem;text-transform:uppercase;letter-spacing:1px;color:var(--muted);
    margin-bottom:6px;font-weight:800;}
  .field input,.field textarea,textarea.answer{width:100%;padding:14px;border-radius:12px;border:1.5px solid var(--line);
    background:var(--bg2);color:var(--text);font-size:1.05rem;font-family:inherit;}
  textarea.answer{min-height:110px;resize:none;line-height:1.4;}
  .field input:focus,textarea.answer:focus{outline:2px solid var(--gold);border-color:var(--gold);}
  .charcount{font-size:.8rem;color:var(--muted);text-align:right;margin-top:4px;}
  .pill-row{display:flex;gap:8px;}
  .pill-row button{flex:1;padding:12px 0;border-radius:12px;border:1.5px solid var(--line);background:var(--card);
    color:var(--text);font-weight:800;font-family:inherit;font-size:1rem;cursor:pointer;}
  .pill-row button.active{background:var(--gold);color:#1a0b2e;border-color:var(--gold);}
  .grow{flex:1;}
  .handoff{text-align:center;padding:26px 0;}
  .handoff .emoji{font-size:3.6rem;margin-bottom:6px;}
  .handoff .big{font-size:2rem;font-weight:900;margin:8px 0 2px;color:var(--gold);}
  .progress{font-size:.8rem;color:var(--muted);letter-spacing:1.5px;text-transform:uppercase;font-weight:800;margin-bottom:6px;}
  .scoreline{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-radius:12px;
    background:var(--card);border:1.5px solid var(--line);margin-bottom:9px;font-weight:700;}
  .scoreline .pts{font-weight:900;color:var(--gold);font-size:1.1rem;}
  .scoreline.leader{border-color:var(--gold);background:var(--card-hi);}
  .ans-card{padding:13px 15px;border-radius:12px;border:1.5px solid var(--line);margin-bottom:10px;background:var(--card);}
  .ans-card .txt{font-weight:600;}
  .ans-card .meta{font-size:.84rem;color:var(--cyan);margin-top:6px;font-weight:800;}
  .ans-card .meta .p{color:var(--gold);}
  .footer-note{font-size:.78rem;color:var(--muted);text-align:center;margin-top:20px;}
  details{margin-top:14px;} summary{cursor:pointer;color:var(--muted);font-weight:800;font-size:.9rem;}
  details p{font-size:.9rem;color:var(--muted);margin-top:10px;}
  .status-dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--muted);margin-right:7px;vertical-align:middle;}
  .status-dot.on{background:var(--green);box-shadow:0 0 8px var(--green);}
  .qrbox{background:#fff;border-radius:16px;padding:16px;max-width:340px;margin:14px auto;}
  .qrbox svg{display:block;width:100%;height:auto;}
  .pairbtn{display:block;width:100%;max-width:340px;margin:10px auto 0;border:1.5px solid var(--line);
    background:var(--card);color:var(--text);border-radius:12px;padding:13px 16px;font-weight:800;font-size:1rem;
    font-family:inherit;cursor:pointer;}
  .pairbtn.go{background:linear-gradient(135deg,var(--gold),#ffe487);color:#1a0b2e;border:none;}
  .step{font-size:.8rem;font-weight:900;letter-spacing:2px;text-transform:uppercase;color:var(--cyan);margin:4px 0 2px;}
  video.scan{width:100%;max-width:340px;border-radius:16px;margin:12px auto;display:block;background:#000;border:2px solid var(--line);}
  textarea.code{width:100%;min-height:90px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg2);
    color:var(--text);font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.8rem;padding:10px;}

  /* ============ BIG SCREEN ============ */
  .screen{position:fixed;inset:0;overflow:hidden;background:
    radial-gradient(60% 50% at 20% 0%, rgba(255,63,164,.18), transparent 60%),
    radial-gradient(60% 50% at 85% 10%, rgba(69,230,212,.15), transparent 60%),
    radial-gradient(130% 90% at 50% 0%, var(--bg1) 0%, var(--bg2) 75%);}
  .screen .stage{position:absolute;inset:0;display:flex;flex-direction:column;padding:3.5vh 4vw 3vh;}
  .blob{position:absolute;border-radius:50%;filter:blur(40px);opacity:.28;animation:drift 18s ease-in-out infinite;}
  @keyframes drift{0%,100%{transform:translate(0,0) scale(1);}50%{transform:translate(4vw,3vh) scale(1.15);}}
  .screen .body{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;z-index:2;min-height:0;overflow:hidden;padding-bottom:1vh;}
  .screen .cat{font-size:1.5vw;font-weight:900;letter-spacing:3px;text-transform:uppercase;color:var(--magenta);margin-bottom:1.2vh;}
  .screen .q{font-size:3vw;font-weight:900;max-width:84vw;line-height:1.18;margin-bottom:2.6vh;text-wrap:balance;}
  .screen .answers{display:grid;grid-template-columns:1fr 1fr;gap:1.6vh 2vw;width:80vw;max-width:1150px;}
  .screen .acard{position:relative;background:var(--card);border:2px solid var(--line);border-radius:16px;
    padding:2vh 1.8vw;font-size:1.7vw;font-weight:700;text-align:left;line-height:1.3;min-height:11vh;
    display:flex;align-items:center;gap:1vw;transition:transform .4s,border-color .4s,background .4s,box-shadow .4s;}
  .screen .acard .slot{flex:none;width:3vw;height:3vw;min-width:32px;min-height:32px;border-radius:9px;display:grid;
    place-items:center;font-weight:900;background:rgba(255,255,255,.08);color:var(--muted);font-size:1.5vw;}
  .screen .acard .medal{position:absolute;top:-1.6vh;right:-1vw;font-size:2.6vw;opacity:0;transform:scale(0) rotate(-20deg);
    transition:opacity .45s,transform .45s cubic-bezier(.2,1.5,.4,1);}
  .screen .acard.ranked{border-color:var(--gold);}
  .screen .acard.ranked .medal{opacity:1;transform:scale(1) rotate(-8deg);}
  .screen .acard .author{position:absolute;bottom:-1.4vh;left:1.4vw;font-size:1.05vw;font-weight:900;padding:.4vh 1vw;
    border-radius:999px;background:var(--cyan);color:#06231f;opacity:0;transform:translateY(.6vh);transition:opacity .4s,transform .4s;white-space:nowrap;}
  .screen .acard.shown .author{opacity:1;transform:none;}
  .screen .acard.mine .author{background:var(--magenta);color:#2a0016;}
  .screen .acard .gain{position:absolute;top:-1.4vh;left:1.4vw;font-size:1.5vw;font-weight:900;color:var(--green);opacity:0;}
  .screen .acard .gain.go{animation:gain 1.6s ease-out forwards;}
  @keyframes gain{0%{opacity:0;transform:translateY(1vh);}20%{opacity:1;}100%{opacity:0;transform:translateY(-3vh);}}

  .screen .pods{display:flex;gap:1.4vw;justify-content:center;align-items:flex-end;z-index:2;padding-top:2.4vh;}
  .pod{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:1.6vh 1.6vw;min-width:11vw;
    text-align:center;transition:transform .35s,border-color .35s,box-shadow .35s;position:relative;}
  .pod .av{font-size:2.6vw;}
  .pod .nm{font-weight:900;font-size:1.5vw;margin-top:.3vh;letter-spacing:.5px;}
  .pod .sc{font-weight:900;font-size:2.2vw;color:var(--gold);}
  .pod.active{border-color:var(--cyan);transform:translateY(-1.4vh) scale(1.04);box-shadow:0 0 34px rgba(69,230,212,.45);}
  .pod.locked{border-color:var(--green);}
  .pod.judge{border-color:var(--magenta);}
  .pod .stamp{position:absolute;top:-1.2vh;right:-1vw;background:var(--green);color:#06210f;font-weight:900;
    font-size:1vw;padding:.4vh .9vw;border-radius:999px;transform:rotate(8deg) scale(0);transition:transform .3s;}
  .pod.locked .stamp{transform:rotate(8deg) scale(1);}

  .screen .roundword{font-size:2.4vw;font-weight:900;letter-spacing:6px;text-transform:uppercase;color:var(--muted);}
  .screen .huge{font-size:9vw;font-weight:900;letter-spacing:-.5px;}
  .pop{animation:pop .5s cubic-bezier(.2,1.4,.4,1) both;}
  @keyframes pop{from{transform:scale(.6);opacity:0;}to{transform:scale(1);opacity:1;}}
  .fade{animation:fade .5s ease both;}
  @keyframes fade{from{opacity:0;transform:translateY(1.5vh);}to{opacity:1;transform:none;}}
  .pair-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;z-index:2;position:relative;text-align:center;}
  .pair-wrap .qrbox{max-width:min(56vh,480px);}
  .pair-wrap .pairbtn{max-width:min(56vh,480px);font-size:1.3vw;padding:1.4vh 1vw;}
  .pair-wrap .step{font-size:1.1vw;}
  .pair-wrap h1{font-size:4vw;}
  .pair-wrap p{font-size:1.7vw;color:var(--muted);max-width:60vw;}
  .bigscoreboard{width:70vw;max-width:1000px;}
  .bar{display:flex;align-items:center;gap:1.5vw;margin-bottom:1.8vh;font-weight:900;}
  .bar .lbl{width:12vw;text-align:right;font-size:1.7vw;}
  .bar .track{flex:1;height:3.4vh;background:var(--card);border-radius:999px;overflow:hidden;border:2px solid var(--line);}
  .bar .fill{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--magenta),var(--gold));width:0;transition:width 1.1s cubic-bezier(.2,.8,.2,1);}
  .bar .val{width:5vw;font-size:2vw;color:var(--gold);}
  .crown{font-size:8vw;}
  .happy{font-size:3.6vw;font-weight:900;background:linear-gradient(90deg,var(--gold),var(--magenta),var(--cyan));
    -webkit-background-clip:text;background-clip:text;color:transparent;}

  .confetti{position:fixed;top:-14px;width:12px;height:16px;z-index:99;pointer-events:none;border-radius:2px;}
  @keyframes fall{to{transform:translateY(112vh) rotate(720deg);}}
  .toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--card);border:1.5px solid var(--line);
    color:var(--text);padding:10px 16px;border-radius:12px;font-weight:700;font-size:.9rem;z-index:120;}
  .mutebtn{position:fixed;top:12px;right:14px;z-index:120;background:rgba(0,0,0,.35);border:1px solid var(--line);
    color:var(--text);border-radius:10px;padding:8px 12px;font-weight:800;cursor:pointer;font-size:1.1rem;}
</style>
</head>
<body>
<div id="app"></div>
<script src="vendor/qrcode.min.js"></script>
<script src="vendor/jsQR.min.js"></script>
<script>
(function () {
  "use strict";

  /* ================================================================
     PROMPTS  —  open-ended. Players type an answer; Erica ranks them.
     Edit / add freely. "{E}" is replaced with the judge's name,
     "{F}" with the first guesser's name.
  ================================================================ */
  var PROMPTS = [
    { cat: "Origin Story",  q: "{E}'s villain origin story: it all started when ___" },
    { cat: "Memoir",        q: "The title of {E}'s autobiography would be ___" },
    { cat: "Dating Profile", q: "{E}'s dating profile bio, in one line: ___" },
    { cat: "Game Design",   q: "One rule {E} would add to World of Warcraft: ___" },
    { cat: "Text History",  q: "The single most {E} text message of all time: ___" },
    { cat: "Famous Last Words", q: "{E}'s actual last words will probably be ___" },
    { cat: "Roman Empire",  q: "The thing {E} thinks about constantly for no reason: ___" },
    { cat: "Naming Things", q: "What {E} would name her guild, her band, or her firstborn: ___" },
    { cat: "Buried With",   q: "The one item that absolutely must be buried with {E}: ___" },
    { cat: "Spin It",       q: "{E}'s worst trait — but phrased as a strength on a résumé: ___" },
    { cat: "New Holiday",   q: "A national holiday that should exist purely for {E}: ___" },
    { cat: "Entrance Music", q: "{E}'s pro-wrestling entrance song, and why it fits: ___" },
    { cat: "The Lie",       q: "The lie {E} tells more than any other: ___" },
    { cat: "Collectible",   q: "If {E} were a limited-edition figurine, the accessory it comes with is ___" },
    { cat: "2 A.M.",        q: "{E}'s search history at 2 a.m.: ___" },
    { cat: "Nordic Noir",   q: "The plot of the Norwegian crime drama {E} is currently obsessed with: ___" },
    { cat: "Leverage",      q: "{F}'s most reliable trick for getting {E} to leave the house: ___" },
    { cat: "Backstage Rider", q: "One demand on {E}'s backstage rider before a metal show: ___" },
    { cat: "The Usual",     q: "{E}'s sushi order, described as dramatically as possible: ___" },
    { cat: "Forbidden Magic", q: "A spell {E} desperately wishes were real: ___" },
    { cat: "Group Chat",    q: "The group chat would completely fall apart without {E} because ___" },
    { cat: "Spirit Animal", q: "{E}'s spirit animal, plus its one defining behaviour: ___" },
    { cat: "The Excuse",    q: "The reason {E} will give for being late tonight: ___" },
    { cat: "Perfect Friday", q: "How {E} would describe her perfect Friday night to a total stranger: ___" }
  ];

  var RANK_PTS = [3, 2, 1, 0];      // points for having Erica's #1 / #2 / #3 / #4 answer
  var MEDALS = ["🥇", "🥈", "🥉", "4️⃣"];
  var AV_GUESS = ["⚔️", "✨", "🍣"];
  var AV_JUDGE = "🐉";
  var SAVE_KEY = "erica-bday-quiz-v3";
  var MAXLEN = 140;

  var app = document.getElementById("app");

  /* ============================ helpers ============================ */
  function el(tag, props, kids) {
    var n = document.createElement(tag);
    if (props) Object.keys(props).forEach(function (k) {
      if (k === "class") n.className = props[k];
      else if (k === "html") n.innerHTML = props[k];
      else if (k === "text") n.textContent = props[k];
      else if (k.slice(0, 2) === "on") n.addEventListener(k.slice(2), props[k]);
      else if (props[k] != null) n.setAttribute(k, props[k]);
    });
    (kids || []).forEach(function (c) {
      if (c == null) return;
      n.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
    });
    return n;
  }
  function render(nodes) {
    app.innerHTML = "";
    (Array.isArray(nodes) ? nodes : [nodes]).forEach(function (n) { app.appendChild(n); });
    window.scrollTo(0, 0);
  }
  function shuffle(a) {
    a = a.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1)), t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }
  function esc(s) {
    return String(s).replace(/[&<>"]/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
    });
  }
  function toast(msg) {
    var t = el("div", { class: "toast", text: msg });
    document.body.appendChild(t);
    setTimeout(function () { t.remove(); }, 2600);
  }
  function confetti(n) {
    var colors = ["#ffcf3f", "#ff3fa4", "#45e6d4", "#61e690", "#b98bff"];
    for (var i = 0; i < (n || 90); i++) {
      (function (i) {
        var c = el("div", { class: "confetti" });
        c.style.left = Math.random() * 100 + "vw";
        c.style.background = colors[i % colors.length];
        c.style.animation = "fall " + (2.4 + Math.random() * 2.4) + "s linear " + (Math.random() * 1.4) + "s forwards";
        document.body.appendChild(c);
        setTimeout(function () { c.remove(); }, 9000);
      })(i);
    }
  }

  /* ============================ sound ============================ */
  var actx = null, muted = false;
  function sfxInit() {
    try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); if (actx.state === "suspended") actx.resume(); } catch (e) {}
  }
  function tone(freq, dur, type, vol, when) {
    if (muted || !actx) return;
    var t0 = actx.currentTime + (when || 0);
    var o = actx.createOscillator(), g = actx.createGain();
    o.type = type || "sine"; o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol || 0.2, t0 + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(actx.destination);
    o.start(t0); o.stop(t0 + dur + 0.05);
  }
  var SFX = {
    lock:  function () { tone(660, 0.12, "square", 0.15); tone(990, 0.12, "square", 0.12, 0.06); },
    turn:  function () { tone(520, 0.1, "triangle", 0.12); },
    reveal:function () { tone(300, 0.2, "sawtooth", 0.1); tone(450, 0.2, "sawtooth", 0.1, 0.1); },
    points:function () { tone(880, 0.08, "square", 0.12); tone(1175, 0.1, "square", 0.12, 0.08); },
    round: function () { [523, 659, 784, 1046].forEach(function (f, i) { tone(f, 0.16, "triangle", 0.14, i * 0.09); }); },
    win:   function () { [523, 659, 784, 1046, 1318, 1568].forEach(function (f, i) { tone(f, 0.3, "triangle", 0.16, i * 0.12); }); }
  };

  /* ==================== compression / signaling ==================== */
  function b64enc(bytes) { var s = ""; for (var i = 0; i < bytes.length; i++) s += String.fromCharCode(bytes[i]); return btoa(s); }
  function b64dec(str) { var s = atob(str), a = new Uint8Array(s.length); for (var i = 0; i < s.length; i++) a[i] = s.charCodeAt(i); return a; }
  async function pack(obj) {
    var json = JSON.stringify(obj);
    if (typeof CompressionStream === "function") {
      try {
        var cs = new CompressionStream("gzip");
        var stream = new Blob([json]).stream().pipeThrough(cs);
        var buf = await new Response(stream).arrayBuffer();
        return "g" + b64enc(new Uint8Array(buf));
      } catch (e) {}
    }
    return "r" + btoa(unescape(encodeURIComponent(json)));
  }
  async function unpack(str) {
    str = str.trim();
    var tag = str[0], body = str.slice(1);
    if (tag === "g") {
      var ds = new DecompressionStream("gzip");
      var stream = new Blob([b64dec(body)]).stream().pipeThrough(ds);
      return JSON.parse(await new Response(stream).text());
    }
    return JSON.parse(decodeURIComponent(escape(atob(body))));
  }

  var RTC_CFG = { iceServers: [{ urls: "stun:stun.l.google.com:19302" }] };
  function iceComplete(pc) {
    return new Promise(function (resolve) {
      if (pc.iceGatheringState === "complete") return resolve();
      var done = false;
      function finish() { if (done) return; done = true; pc.removeEventListener("icegatheringstatechange", check); resolve(); }
      function check() { if (pc.iceGatheringState === "complete") finish(); }
      pc.addEventListener("icegatheringstatechange", check);
      setTimeout(finish, 2800);
    });
  }

  /* ============================== QR ============================== */
  function makeQR(text) {
    var qr = qrcode(0, "L");
    qr.addData(text);
    qr.make();
    var box = el("div", { class: "qrbox" });
    box.innerHTML = qr.createSvgTag({ cellSize: 3, margin: 2, scalable: true });
    return box;
  }
  function scanner(onResult, onFail) {
    var video = el("video", { class: "scan", autoplay: "", playsinline: "", muted: "" });
    var canvas = document.createElement("canvas");
    var ctx = canvas.getContext("2d", { willReadFrequently: true });
    var stream = null, raf = null, stopped = false;
    navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } })
      .then(function (s) { stream = s; video.srcObject = s; video.play().catch(function () {}); raf = requestAnimationFrame(tick); })
      .catch(function (err) { if (onFail) onFail(err); });
    function tick() {
      if (stopped) return;
      if (video.readyState === video.HAVE_ENOUGH_DATA && video.videoWidth) {
        canvas.width = video.videoWidth; canvas.height = video.videoHeight;
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        try {
          var img = ctx.getImageData(0, 0, canvas.width, canvas.height);
          var code = jsQR(img.data, img.width, img.height, { inversionAttempts: "dontInvert" });
          if (code && code.data) { stop(); onResult(code.data); return; }
        } catch (e) {}
      }
      raf = requestAnimationFrame(tick);
    }
    function stop() { stopped = true; if (raf) cancelAnimationFrame(raf); if (stream) stream.getTracks().forEach(function (t) { t.stop(); }); }
    return { video: video, stop: stop };
  }

  /* ============================ role router ======================= */
  function boot() {
    var q = location.search;
    if (/screen/.test(q)) return Screen.start();
    if (/play/.test(q)) return Controller.start();
    landing();
  }

  function landing() {
    document.body.dataset.role = "ctrl";
    render(el("div", { class: "ctrl" }, [
      el("h1", { class: "center", html: "🎂 Erica's Birthday Quiz" }),
      el("p", { class: "center muted", text: "Open prompts. Everyone types an answer. Erica ranks all four blind, then the reveal shows who wrote what." }),
      el("div", { class: "card" }, [
        el("h2", { text: "Set this device up as…" }),
        el("button", { class: "btn", onclick: function () { sfxInit(); Screen.start(); } }, ["📺  The Big Screen"]),
        el("p", { class: "muted", style: "margin:8px 0 0;font-size:.86rem", text: "The laptop / TV everyone watches. Open this first." }),
        el("button", { class: "btn secondary", onclick: function () { sfxInit(); Controller.start(); } }, ["📱  The Controller"]),
        el("p", { class: "muted", style: "margin:8px 0 0;font-size:.86rem", text: "The phone you type on and pass around. Pairs to the Big Screen — or just play on this phone alone." })
      ]),
      el("details", {}, [
        el("summary", { text: "How scoring works" }),
        el("p", { html: "Each round every player (Erica too) types one answer to the prompt. The four answers appear shuffled and anonymous. Erica ranks them 1–4.<br><br>Your answer scores <b>3 / 2 / 1 / 0</b> for Erica's #1 / #2 / #3 / #4 — and one of the four is Erica's own, so aim to beat it. Most points after all rounds wins. Erica judges and isn't scored." })
      ]),
      el("p", { class: "footer-note", text: "Best friends only · Ethan · Ellie · Mitch · Erica" })
    ]));
  }

  /* ============================ peer link ======================== */
  function PeerLink() { this.pc = null; this.ch = null; this.onopen = null; this.onmessage = null; this.onclose = null; }
  if (/dev/.test(location.hash)) { window.PeerLink = PeerLink; window.__pack = pack; window.__unpack = unpack; }
  PeerLink.prototype._wire = function (ch) {
    var self = this;
    this.ch = ch;
    ch.onopen = function () { if (self.onopen) self.onopen(); };
    ch.onclose = function () { if (self.onclose) self.onclose(); };
    ch.onmessage = function (e) { if (!self.onmessage) return; try { self.onmessage(JSON.parse(e.data)); } catch (x) {} };
  };
  PeerLink.prototype.send = function (obj) {
    if (this.ch && this.ch.readyState === "open") { try { this.ch.send(JSON.stringify(obj)); } catch (e) {} }
  };
  PeerLink.prototype.createOffer = async function () {
    var self = this;
    this.pc = new RTCPeerConnection(RTC_CFG);
    this._wire(this.pc.createDataChannel("game", { ordered: true }));
    this.pc.oniceconnectionstatechange = function () {
      var s = self.pc.iceConnectionState;
      if ((s === "failed" || s === "disconnected") && self.onclose) self.onclose();
    };
    await this.pc.setLocalDescription(await this.pc.createOffer());
    await iceComplete(this.pc);
    return pack(this.pc.localDescription);
  };
  PeerLink.prototype.acceptAnswer = async function (code) { await this.pc.setRemoteDescription(await unpack(code)); };
  PeerLink.prototype.acceptOffer = async function (code) {
    var self = this;
    this.pc = new RTCPeerConnection(RTC_CFG);
    this.pc.ondatachannel = function (e) { self._wire(e.channel); };
    this.pc.oniceconnectionstatechange = function () {
      var s = self.pc.iceConnectionState;
      if ((s === "failed" || s === "disconnected") && self.onclose) self.onclose();
    };
    await this.pc.setRemoteDescription(await unpack(code));
    await this.pc.setLocalDescription(await this.pc.createAnswer());
    await iceComplete(this.pc);
    return pack(this.pc.localDescription);
  };

  /* ============================================================
     CONTROLLER  (phone) — owns the game
  ============================================================ */
  var Controller = (function () {
    var link = new PeerLink();
    var connected = false;
    var S = null;

    function start() {
      document.body.dataset.role = "ctrl";
      muted = true;
      var saved = loadState();
      if (saved && !saved.finished) return resumePrompt(saved);
      pairScreen();
    }
    function loadState() { try { return JSON.parse(localStorage.getItem(SAVE_KEY)); } catch (e) { return null; } }
    function saveState() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch (e) {} }
    function clearState() { try { localStorage.removeItem(SAVE_KEY); } catch (e) {} }

    function resumePrompt(saved) {
      render(el("div", { class: "ctrl" }, [
        el("h1", { class: "center", text: "Game in progress" }),
        el("p", { class: "center muted", text: "Round " + (saved.round + 1) + " of " + saved.order.length + "." }),
        el("div", { class: "card" }, [
          el("button", { class: "btn", onclick: function () { S = saved; pairScreen(true); } }, ["Resume"]),
          el("button", { class: "btn secondary", onclick: function () { clearState(); pairScreen(); } }, ["Start a new game"])
        ])
      ]));
    }

    /* ---------- pairing ---------- */
    function pairScreen(afterResume) {
      var wrap = el("div", { class: "ctrl" });
      wrap.appendChild(el("h1", { class: "center", text: "Connect to the Big Screen" }));
      wrap.appendChild(el("p", { class: "center muted", text: "On the laptop/TV, open this same page and choose “The Big Screen”. Then point your camera at the code it shows." }));
      var slot = el("div", {});
      wrap.appendChild(slot);
      wrap.appendChild(el("button", { class: "btn secondary", onclick: function () { pasteOfferUI(slot); } }, ["Can't scan? Paste the code"]));
      wrap.appendChild(el("button", { class: "btn ghost", onclick: function () { connected = false; setup(afterResume); } }, ["Skip — just play on this phone"]));
      render(wrap);

      if (/dev/.test(location.hash)) window.__feedOffer = function (code) { gotOffer(code, slot, afterResume); };
      var sc = scanner(function (data) { gotOffer(data, slot, afterResume); }, function () {
        slot.innerHTML = "";
        slot.appendChild(el("p", { class: "muted center", text: "Camera unavailable — use “Paste the code” below." }));
      });
      slot.appendChild(el("p", { class: "center muted", text: "Point at the Big Screen’s QR code…" }));
      slot.appendChild(sc.video);
      slot._scanner = sc;
    }
    function pasteOfferUI(slot) {
      if (slot._scanner) slot._scanner.stop();
      slot.innerHTML = "";
      var ta = el("textarea", { class: "code", placeholder: "Paste the Big Screen code here" });
      slot.appendChild(ta);
      slot.appendChild(el("button", { class: "btn", onclick: function () { gotOffer(ta.value, slot); } }, ["Connect"]));
    }
    async function gotOffer(data, slot, afterResume) {
      if (slot._scanner) slot._scanner.stop();
      slot.innerHTML = "";
      slot.appendChild(el("p", { class: "center muted", text: "Linking…" }));
      link.onopen = function () {
        connected = true; SFX.turn(); toast("Connected to Big Screen 📺");
        if (S) { sendVM(); route(); } else { setup(afterResume); }
      };
      link.onclose = function () { connected = false; toast("Screen disconnected"); };
      var answerCode;
      try { answerCode = await link.acceptOffer(data); }
      catch (e) {
        slot.innerHTML = "";
        slot.appendChild(el("p", { class: "center muted", text: "That code didn’t work. Try again." }));
        slot.appendChild(el("button", { class: "btn secondary", onclick: function () { pairScreen(afterResume); } }, ["Retry"]));
        return;
      }
      if (/dev/.test(location.hash)) window.__answer = answerCode;
      var box = el("div", {});
      box.appendChild(el("div", { class: "step center", text: "Last step — show this to the Big Screen's camera" }));
      try { box.appendChild(makeQR(answerCode)); }
      catch (e) {
        var ta0 = el("textarea", { class: "code" }); ta0.value = answerCode;
        box.appendChild(el("p", { class: "muted center", text: "Copy this into the Big Screen's paste box:" }));
        box.appendChild(ta0);
      }
      box.appendChild(el("p", { class: "center muted", text: "Waiting for the Big Screen…" }));
      box.appendChild(el("button", { class: "btn ghost", onclick: function () {
        var ta = el("textarea", { class: "code" }); ta.value = answerCode; ta.readOnly = true;
        ta.onfocus = function () { ta.select(); };
        box.appendChild(el("p", { class: "muted center", style: "margin-top:10px", text: "Can't scan? Send this text to the laptop and paste it there:" }));
        box.appendChild(ta);
      }}, ["Show code as text"]));
      render(el("div", { class: "ctrl" }, [el("h1", { class: "center", text: "Almost there…" }), box]));
    }

    /* ---------- setup ---------- */
    function setup(afterResume) {
      if (afterResume && S) return route();
      var names = ["Ethan", "Ellie", "Mitch"];
      var judge = "Erica";
      var rounds = 8;
      var wrap = el("div", { class: "ctrl" });
      wrap.appendChild(el("h1", { class: "center", text: "Who's playing?" }));
      wrap.appendChild(el("p", { class: "center muted", html: connected ? "<span class='status-dot on'></span>Big Screen connected" : "<span class='status-dot'></span>Solo on this phone" }));
      function nameField(i) {
        return el("div", { class: "field" }, [
          el("label", { text: "Player " + (i + 1) }),
          el("input", { type: "text", value: names[i], maxlength: "14", oninput: function (e) { names[i] = e.target.value; } })
        ]);
      }
      wrap.appendChild(el("div", { class: "card" }, [
        nameField(0), nameField(1), nameField(2),
        el("div", { class: "field" }, [
          el("label", { text: "The birthday judge" }),
          el("input", { type: "text", value: judge, maxlength: "14", oninput: function (e) { judge = e.target.value; } })
        ])
      ]));
      var pillRow = el("div", { class: "pill-row" });
      [6, 8, 12, PROMPTS.length].forEach(function (n, i) {
        var b = el("button", { class: n === rounds ? "active" : "", text: i === 3 ? "All " + n : String(n), onclick: function () {
          rounds = n;
          Array.prototype.forEach.call(pillRow.children, function (c) { c.classList.remove("active"); });
          b.classList.add("active");
        }});
        pillRow.appendChild(b);
      });
      wrap.appendChild(el("div", { class: "card" }, [el("label", { class: "field", text: "How many rounds?" }), pillRow]));
      wrap.appendChild(el("button", { class: "btn", onclick: function () {
        var g = names.map(function (s, i) { return (s || "").trim() || "Player " + (i + 1); });
        S = {
          players: g.concat([(judge || "").trim() || "Erica"]),   // index 3 = judge
          order: shuffle(PROMPTS.map(function (_, i) { return i; })).slice(0, rounds),
          round: 0, phase: "intro", typeStep: 0, data: null, scores: [0, 0, 0],
          applied: -1, finished: false
        };
        saveState(); sendVM(); route();
      }}, ["Start the quiz →"]));
      if (connected) wrap.appendChild(el("button", { class: "btn ghost", onclick: function () { pairScreen(); } }, ["Re-pair the Big Screen"]));
      render(wrap);
      sendVM({ phase: "lobby" });
    }

    /* ---------- helpers ---------- */
    function judgeName() { return S.players[3]; }
    function firstGuesser() { return S.players[0]; }
    function curPrompt() {
      var p = PROMPTS[S.order[S.round]];
      return { cat: p.cat, q: p.q.replace(/\{E\}/g, judgeName()).replace(/\{F\}/g, firstGuesser()) };
    }
    function typeOrder() {
      // rotate the 3 guessers for fairness; judge always types last
      var r = S.round % 3;
      return [0, 1, 2].slice(r).concat([0, 1, 2].slice(0, r)).concat([3]);
    }

    /* ---------- view-model to screen ---------- */
    function baseVM() {
      return {
        names: { guessers: S ? S.players.slice(0, 3) : [], judge: S ? S.players[3] : "Erica" },
        scores: S ? S.scores : [0, 0, 0],
        round: S ? S.round : 0,
        total: S ? S.order.length : 0
      };
    }
    function sendVM(extra) {
      if (!connected) return;
      var vm = extra ? Object.assign(baseVM(), extra) : decorateVM(baseVM());
      link.send({ t: "vm", vm: vm });
    }
    function decorateVM(vm) {
      if (!S) { vm.phase = "lobby"; return vm; }
      var p = curPrompt();
      if (S.phase === "intro") { vm.phase = "round-intro"; vm.cat = p.cat; }
      else if (S.phase === "type") {
        vm.phase = "typing"; vm.cat = p.cat; vm.q = p.q;
        var ord = typeOrder();
        var locked = [false, false, false, false];
        for (var i = 0; i < S.typeStep; i++) locked[ord[i]] = true;
        vm.locked = locked;
        vm.active = S.typeStep < 4 ? ord[S.typeStep] : null;   // player index 0..3
      } else if (S.phase === "rank") {
        vm.phase = "ranking"; vm.cat = p.cat; vm.q = p.q;
        vm.pool = S.data.shuffle.map(function (ai) { return S.data.answers[ai].text; });
        vm.rankingSoFar = S.data.ranking || [];
      } else if (S.phase === "reveal") {
        vm.phase = "reveal"; vm.cat = p.cat; vm.q = p.q;
        vm.pool = S.data.shuffle.map(function (ai) {
          var a = S.data.answers[ai];
          return { text: a.text, by: a.by };                    // by: 0..3
        });
        vm.ranking = S.data.ranking;                            // display-slot order
        vm.roundPoints = [0, 1, 2].map(roundPoints);
        vm.prevScores = S.applied === S.round
          ? [0, 1, 2].map(function (i) { return S.scores[i] - vm.roundPoints[i].total; })
          : S.scores.slice();
      } else if (S.phase === "end") { vm.phase = "end"; }
      return vm;
    }

    /* ---------- router ---------- */
    function route() {
      saveState();
      if (S.phase === "intro") return cIntro();
      if (S.phase === "type") return cType();
      if (S.phase === "rank") return cRank();
      if (S.phase === "reveal") return cReveal();
      if (S.phase === "end") return cEnd();
    }
    function go(phase) { S.phase = phase; saveState(); if (phase !== "reveal") sendVM(); route(); }

    function handoff(emoji, name, sub, btn, next) {
      render(el("div", { class: "ctrl" }, [
        el("div", { class: "grow" }),
        el("div", { class: "handoff" }, [
          el("div", { class: "emoji", text: emoji }),
          el("p", { class: "muted", text: sub }),
          el("div", { class: "big", text: name })
        ]),
        el("div", { class: "grow" }),
        el("button", { class: "btn", onclick: next }, [btn])
      ]));
    }

    function cIntro() {
      var p = curPrompt();
      render(el("div", { class: "ctrl" }, [
        el("div", { class: "progress center", text: "Round " + (S.round + 1) + " of " + S.order.length }),
        el("div", { class: "center", style: "margin:18px 0" }, [el("span", { class: "tag", text: p.cat })]),
        el("h2", { class: "center", text: p.q }),
        el("div", { class: "grow" }),
        el("p", { class: "muted center", text: connected ? "Everyone read it on the Big Screen. Then pass the phone round so each of you types an answer." : "Read it out. Then pass the phone round so each of you types an answer." }),
        el("button", { class: "btn", onclick: function () {
          S.data = { answers: [null, null, null, null], shuffle: null, ranking: [] };
          S.typeStep = 0; go("type");
        }}, ["Start typing answers"]),
        el("button", { class: "btn ghost", onclick: function () {
          if (confirm("Quit this game?")) { clearState(); location.search = ""; }
        }}, ["Quit game"])
      ]));
    }

    function cType() {
      var ord = typeOrder();
      if (S.typeStep >= 4) {
        // build the shuffled pool, then Erica (still holding the phone) ranks
        S.data.shuffle = shuffle([0, 1, 2, 3]);
        return go("rank");
      }
      var pi = ord[S.typeStep];
      var name = S.players[pi];
      var isJudge = pi === 3;
      handoff(isJudge ? "🐉" : "📱", name,
        isJudge ? "Everyone look away — pass to" : "Pass the phone to",
        "I'm " + name + " — ready", function () {
        var p = curPrompt();
        var ta = el("textarea", { class: "answer", maxlength: String(MAXLEN), placeholder: "Type your answer…", autocapitalize: "sentences" });
        var count = el("div", { class: "charcount", text: "0 / " + MAXLEN });
        var btn = el("button", { class: "btn", disabled: "disabled", onclick: function () {
          S.data.answers[pi] = { by: pi, text: ta.value.trim() };
          S.typeStep++; saveState(); sendVM(); go("type");
        }}, ["Lock in answer"]);
        ta.addEventListener("input", function () {
          var v = ta.value.trim();
          count.textContent = ta.value.length + " / " + MAXLEN;
          btn.disabled = v.length === 0;
        });
        render(el("div", { class: "ctrl" }, [
          el("div", { class: "progress", text: name + (isJudge ? " — your real answer" : " — your answer") }),
          el("div", { class: "prompt", text: p.q }),
          ta, count,
          el("p", { class: "muted", style: "font-size:.88rem", text: isJudge
            ? "Yours goes in the pile with the others. Make it good — you'll rank all four next."
            : "Aim for funny and true to " + judgeName() + ". One of the four answers will be hers." }),
          btn
        ]));
        setTimeout(function () { ta.focus(); }, 50);
      });
    }

    function cRank() {
      // Erica already holds the phone (she typed last) — no handoff
      var p = curPrompt();
      var pool = S.data.shuffle.map(function (ai) { return S.data.answers[ai].text; });
      var ranking = S.data.ranking && S.data.ranking.length ? S.data.ranking.slice() : [];
      var list, btn, hint;
      function paint() {
        Array.prototype.forEach.call(list.children, function (c, di) {
          var pos = ranking.indexOf(di);
          c.querySelector(".rankmark").textContent = pos === -1 ? "" : MEDALS[pos];
          c.classList.toggle("selected", pos !== -1);
        });
        btn.disabled = ranking.length < 4;
        hint.textContent = ranking.length < 4
          ? "Tap them best → worst  (" + ranking.length + "/4)"
          : "Tap a numbered answer to clear it.";
        S.data.ranking = ranking.slice(); saveState(); sendVM();
      }
      list = el("div", {}, pool.map(function (txt, di) {
        return el("button", { class: "opt", onclick: function () {
          var pos = ranking.indexOf(di);
          if (pos !== -1) ranking.splice(pos, 1);
          else if (ranking.length < 4) ranking.push(di);
          paint();
        }}, [el("span", { class: "rankmark" }), el("span", { text: txt })]);
      }));
      hint = el("p", { class: "muted" });
      btn = el("button", { class: "btn", disabled: "disabled", onclick: function () {
        S.data.ranking = ranking.slice(); go("reveal");
      }}, ["Reveal 🎉"]);
      render(el("div", { class: "ctrl" }, [
        el("div", { class: "progress", text: judgeName() + " ranks the four answers" }),
        el("div", { class: "prompt", text: p.q }),
        list, hint, btn
      ]));
      paint();
    }

    function slotOfGuesser(g) {
      // which display slot holds guesser g's answer
      for (var d = 0; d < 4; d++) if (S.data.answers[S.data.shuffle[d]].by === g) return d;
      return -1;
    }
    function roundPoints(g) {
      var d = slotOfGuesser(g);
      var pos = S.data.ranking.indexOf(d);
      var pts = pos === -1 ? 0 : RANK_PTS[pos];
      return { total: pts, pos: pos };
    }

    function cReveal() {
      var p = curPrompt();
      var results = [0, 1, 2].map(roundPoints);
      if (S.applied !== S.round) {
        results.forEach(function (r, i) { S.scores[i] += r.total; });
        S.applied = S.round; saveState();
      }
      sendVM();
      var kids = [
        el("div", { class: "progress center", text: "Round " + (S.round + 1) + " reveal" }),
        el("div", { class: "prompt center", text: p.q })
      ];
      S.data.shuffle.forEach(function (ai, d) {
        var a = S.data.answers[ai];
        var pos = S.data.ranking.indexOf(d);
        var who = a.by === 3 ? judgeName() + " (her own!)" : S.players[a.by];
        var pv = "";
        if (a.by !== 3) { var r = roundPoints(a.by); pv = "  ·  +" + r.total; }
        kids.push(el("div", { class: "ans-card" + (a.by === 3 ? "" : ""), style: a.by === 3 ? "border-color:var(--magenta)" : "" }, [
          el("div", { class: "txt", text: (pos !== -1 ? MEDALS[pos] + "  " : "") + "“" + a.text + "”" }),
          el("div", { class: "meta", html: "— " + esc(who) + "<span class='p'>" + pv + "</span>" })
        ]));
      });
      kids.push(el("h3", { style: "margin-top:20px", text: "Total" }));
      scoreboard(kids);
      var last = S.round >= S.order.length - 1;
      kids.push(el("button", { class: "btn", onclick: function () {
        if (last) { S.finished = true; go("end"); }
        else { S.round++; S.data = null; S.applied = -1; go("intro"); }
      }}, [last ? "See the final results 👑" : "Next round →"]));
      render(el("div", { class: "ctrl" }, kids));
    }

    function scoreboard(kids) {
      var ranked = [0, 1, 2].map(function (i) { return { i: i, s: S.scores[i] }; }).sort(function (a, b) { return b.s - a.s; });
      var top = ranked[0].s;
      ranked.forEach(function (r) {
        kids.push(el("div", { class: "scoreline" + (r.s === top && top > 0 ? " leader" : "") }, [
          el("span", { text: (r.s === top && top > 0 ? "👑 " : "") + S.players[r.i] }),
          el("span", { class: "pts", text: r.s })
        ]));
      });
    }

    function cEnd() {
      confetti(120);
      var ranked = [0, 1, 2].map(function (i) { return { i: i, s: S.scores[i] }; }).sort(function (a, b) { return b.s - a.s; });
      var winners = ranked.filter(function (r) { return r.s === ranked[0].s; });
      var title = winners.length > 1
        ? "Tie: " + winners.map(function (w) { return S.players[w.i]; }).join(" & ") + "!"
        : S.players[winners[0].i] + " knows Erica best!";
      var kids = [
        el("div", { class: "center", style: "font-size:3.4rem", text: "👑" }),
        el("h1", { class: "center", text: title }),
        el("h3", { class: "center", style: "color:var(--gold)", text: "Happy Birthday, " + judgeName() + "!" }),
        el("h3", { text: "Final scoreboard" })
      ];
      scoreboard(kids);
      kids.push(el("button", { class: "btn", onclick: function () { clearState(); location.search = ""; } }, ["Play again"]));
      render(el("div", { class: "ctrl" }, kids));
    }

    return { start: start };
  })();

  /* ============================================================
     BIG SCREEN
  ============================================================ */
  var Screen = (function () {
    var link = new PeerLink();
    var lastKey = "";

    function start() {
      document.body.dataset.role = "screen";
      muted = false; sfxInit();
      pairing();
    }

    function frame(children) {
      render(el("div", { class: "screen" }, [
        el("div", { class: "blob", style: "width:38vw;height:38vw;left:-8vw;top:-6vw;background:var(--magenta);" }),
        el("div", { class: "blob", style: "width:32vw;height:32vw;right:-6vw;top:4vh;background:var(--cyan);animation-delay:-6s;" }),
        el("div", { class: "blob", style: "width:30vw;height:30vw;left:30vw;bottom:-12vh;background:var(--violet);animation-delay:-11s;" }),
        el("button", { class: "mutebtn", onclick: function (e) { muted = !muted; e.target.textContent = muted ? "🔇" : "🔊"; if (!muted) sfxInit(); }, text: "🔊" }),
        el("div", { class: "stage" }, children)
      ]));
    }

    function pairing() {
      var wrap = el("div", { class: "pair-wrap" });
      wrap.appendChild(el("h1", { text: "🎂 Erica's Birthday Quiz" }));
      var slot = el("div", {}); wrap.appendChild(slot);
      frame([wrap]);
      slot.appendChild(el("p", { text: "Generating link…" }));
      link.onopen = function () { SFX.round(); waitLobby(); };
      link.onclose = function () { toast("Controller disconnected"); pairing(); };
      link.onmessage = onMessage;
      link.createOffer().then(function (code) {
        if (/dev/.test(location.hash)) { window.__offer = code; window.__link = link; window.__acceptReply = function (d) { return link.acceptAnswer(d); }; }
        slot.innerHTML = "";
        slot.appendChild(el("div", { class: "step", text: "Step 1 — on the phone, open this page & tap “The Controller”, then scan:" }));
        try { slot.appendChild(makeQR(code)); }
        catch (e) { var ta = el("textarea", { class: "code" }); ta.value = code; slot.appendChild(el("p", { text: "Paste this into the phone:" })); slot.appendChild(ta); }
        slot.appendChild(el("div", { class: "step", text: "Step 2 — the phone shows a code back. Bring it here:" }));
        slot.appendChild(el("button", { class: "pairbtn go", text: "📷  Scan the phone's code", onclick: function () { scanReply(slot); } }));
        slot.appendChild(el("button", { class: "pairbtn", text: "⌨  Paste the phone's code instead", onclick: function () { pasteReply(slot); } }));
      }).catch(function () { slot.innerHTML = ""; slot.appendChild(el("p", { text: "Couldn't start the connection. Reload the page." })); });
    }
    function scanReply(slot) {
      slot.innerHTML = "";
      slot.appendChild(el("div", { class: "step", text: "Hold the phone's QR steady, ~20cm from this camera" }));
      var sc = scanner(function (data) { acceptReply(data, slot); }, function () {
        slot.innerHTML = ""; slot.appendChild(el("p", { text: "No camera available here." })); pasteReply(slot);
      });
      slot.appendChild(sc.video);
      slot.appendChild(el("button", { class: "pairbtn", text: "⌨  Paste the code instead", onclick: function () { sc.stop(); pasteReply(slot); } }));
    }
    function pasteReply(slot) {
      slot.innerHTML = "";
      slot.appendChild(el("div", { class: "step", text: "Paste the code the phone is showing" }));
      var ta = el("textarea", { class: "code", placeholder: "Paste the phone's code here" });
      slot.appendChild(ta);
      slot.appendChild(el("button", { class: "pairbtn go", text: "Connect", onclick: function () { acceptReply(ta.value, slot); } }));
    }
    async function acceptReply(data, slot) {
      try { await link.acceptAnswer(data); slot.innerHTML = ""; slot.appendChild(el("p", { text: "Linking…" })); }
      catch (e) { toast("That code didn't work — try again"); }
    }

    function waitLobby() {
      frame([el("div", { class: "body" }, [
        el("div", { class: "roundword pop", text: "Connected" }),
        el("div", { class: "q fade", text: "Waiting for the game to start on the phone…" }),
        el("div", { class: "cat fade", text: "📱 → 📺" })
      ])]);
    }

    function onMessage(m) { if (m.t === "vm") applyVM(m.vm); }
    if (/dev/.test(location.hash)) window.__applyVM = function (vm) { applyVM(vm); };

    function pods(vm, opts) {
      opts = opts || {};
      var row = el("div", { class: "pods" });
      var jp = el("div", { class: "pod judge" }, [
        el("div", { class: "av", text: AV_JUDGE }),
        el("div", { class: "nm", text: vm.names.judge }),
        el("div", { class: "sc", style: "font-size:1.4vw;color:var(--magenta)", text: "JUDGE" }),
        el("div", { class: "stamp", text: "DONE" })
      ]);
      if (opts.active === 3) jp.classList.add("active");
      if (opts.locked && opts.locked[3]) jp.classList.add("locked");
      var g = vm.names.guessers.map(function (nm, i) {
        var p = el("div", { class: "pod" }, [
          el("div", { class: "av", text: AV_GUESS[i] }),
          el("div", { class: "nm", text: nm }),
          el("div", { class: "sc", id: "sc" + i, text: vm.scores[i] }),
          el("div", { class: "stamp", text: "LOCKED" })
        ]);
        if (opts.locked && opts.locked[i]) p.classList.add("locked");
        if (opts.active === i) p.classList.add("active");
        return p;
      });
      row.appendChild(g[0]); row.appendChild(jp); row.appendChild(g[1]); row.appendChild(g[2]);
      row._guesserPods = g;
      return row;
    }

    function answerGrid(vm, opts) {
      opts = opts || {};
      var grid = el("div", { class: "answers" });
      (vm.pool || []).forEach(function (item, d) {
        var text = typeof item === "string" ? item : item.text;
        var card = el("div", { class: "acard" }, [
          el("div", { class: "slot", text: opts.hideSlot ? "" : (d + 1) }),
          el("div", { text: "“" + text + "”" }),
          el("div", { class: "medal" }),
          el("div", { class: "author" }),
          el("div", { class: "gain" })
        ]);
        grid.appendChild(card);
      });
      return grid;
    }

    function applyVM(vm) {
      var key = [vm.phase, vm.round, vm.active, (vm.locked || []).join(""), (vm.rankingSoFar || []).join("")].join("|");
      var changed = key !== lastKey; lastKey = key;

      if (vm.phase === "lobby") {
        if (!vm.names.guessers.length) return waitLobby();
        frame([
          el("div", { class: "body" }, [
            el("div", { class: "roundword pop", text: "Get Ready" }),
            el("div", { class: "q fade", text: "How Well Do You Know Erica?" })
          ]),
          pods(vm, {})
        ]);
        return;
      }
      if (vm.phase === "round-intro") {
        if (changed) SFX.round();
        frame([el("div", { class: "body" }, [
          el("div", { class: "roundword pop", text: "Round " + (vm.round + 1) + " / " + vm.total }),
          el("div", { class: "cat fade", style: "margin-top:2vh", text: vm.cat }),
          el("div", { class: "huge pop", style: "font-size:6vw;margin-top:1vh", text: "✍️" })
        ])]);
        return;
      }
      if (vm.phase === "typing") {
        var n = (vm.locked || []).filter(Boolean).length;
        var who = vm.active == null ? "All answers in"
          : (vm.active === 3 ? vm.names.judge : vm.names.guessers[vm.active]) + " is typing…";
        if (changed && n > 0) SFX.lock();
        frame([
          el("div", { class: "body" }, [
            el("div", { class: "cat fade", text: vm.cat }),
            el("div", { class: "q fade", text: vm.q }),
            el("div", { class: "roundword fade", style: "margin-top:2vh;font-size:2vw;color:var(--cyan)", text: who }),
            el("div", { class: "roundword fade", style: "margin-top:1vh;font-size:1.5vw", text: n + " / 4 locked in" })
          ]),
          pods(vm, { active: vm.active, locked: vm.locked })
        ]);
        return;
      }
      if (vm.phase === "ranking") {
        var grid = answerGrid(vm, {});
        (vm.rankingSoFar || []).forEach(function (d, pos) {
          var c = grid.children[d];
          if (c) { c.classList.add("ranked"); c.querySelector(".medal").textContent = MEDALS[pos]; }
        });
        if (changed) SFX.turn();
        frame([
          el("div", { class: "body" }, [
            el("div", { class: "cat fade", text: vm.cat }),
            el("div", { class: "q fade", text: vm.q }),
            grid,
            el("div", { class: "roundword fade", style: "margin-top:2.4vh;font-size:1.8vw;color:var(--magenta)", text: "👑 " + vm.names.judge + " is ranking the answers…" })
          ]),
          pods(vm, { active: 3 })
        ]);
        return;
      }
      if (vm.phase === "reveal") { renderReveal(vm, changed); return; }
      if (vm.phase === "end") { renderEnd(vm); return; }
    }

    function renderReveal(vm, animate) {
      var podRow = pods(vm, {});
      var grid = answerGrid(vm, {});
      var caption = el("div", { class: "roundword fade", style: "margin-top:2.2vh;font-size:1.6vw;color:var(--cyan);text-transform:none;letter-spacing:1px", text: "" });
      frame([
        el("div", { class: "body" }, [
          el("div", { class: "cat fade", text: vm.cat }),
          el("div", { class: "q fade", text: vm.q }),
          grid, caption
        ]),
        podRow
      ]);
      var cards = grid.children;
      var prev = vm.prevScores || vm.scores;
      [0, 1, 2].forEach(function (i) { var e = podRow.querySelector("#sc" + i); if (e) e.textContent = prev[i]; });

      function slotOf(by) { for (var d = 0; d < vm.pool.length; d++) if (vm.pool[d].by === by) return d; return -1; }

      if (!animate) {
        vm.ranking.forEach(function (d, pos) { cards[d].classList.add("ranked"); cards[d].querySelector(".medal").textContent = MEDALS[pos]; });
        finishReveal();
        return;
      }
      SFX.reveal();
      // 1) medals appear #1 → #4
      vm.ranking.forEach(function (d, pos) {
        setTimeout(function () {
          cards[d].classList.add("ranked");
          cards[d].querySelector(".medal").textContent = MEDALS[pos];
          SFX.points();
        }, 700 + pos * 850);
      });
      // 2) reveal authors + points
      setTimeout(finishReveal, 700 + 4 * 850 + 400);

      function finishReveal() {
        vm.pool.forEach(function (item, d) {
          var card = cards[d];
          var isJudge = item.by === 3;
          var name = isJudge ? vm.names.judge + " — her own!" : vm.names.guessers[item.by];
          card.querySelector(".author").textContent = name;
          card.classList.add("shown");
          if (isJudge) card.classList.add("mine");
        });
        vm.roundPoints.forEach(function (rp, i) {
          var d = slotOf(i);
          if (d >= 0 && rp.total > 0) {
            var gain = cards[d].querySelector(".gain");
            gain.textContent = "+" + rp.total;
            gain.classList.add("go");
          }
          if (rp.total >= 3) confetti(18);
        });
        SFX.points();
        caption.textContent = vm.names.guessers.map(function (n, i) { return n + " +" + vm.roundPoints[i].total; }).join("    ·    ");
        setTimeout(function () {
          [0, 1, 2].forEach(function (i) { var e = podRow.querySelector("#sc" + i); if (e) e.textContent = vm.scores[i]; });
        }, 900);
      }
    }

    function renderEnd(vm) {
      SFX.win(); confetti(200);
      var ranked = [0, 1, 2].map(function (i) { return { i: i, s: vm.scores[i] }; }).sort(function (a, b) { return b.s - a.s; });
      var winners = ranked.filter(function (r) { return r.s === ranked[0].s; });
      var title = winners.length > 1
        ? "It's a tie!  " + winners.map(function (w) { return vm.names.guessers[w.i]; }).join(" & ")
        : vm.names.guessers[winners[0].i] + " knows Erica best!";
      var maxS = Math.max(1, ranked[0].s);
      var board = el("div", { class: "bigscoreboard" });
      ranked.forEach(function (r, k) {
        var fill = el("div", { class: "fill" });
        board.appendChild(el("div", { class: "bar" }, [
          el("div", { class: "lbl", text: (k === 0 && r.s > 0 ? "👑 " : "") + vm.names.guessers[r.i] }),
          el("div", { class: "track" }, [fill]),
          el("div", { class: "val", text: r.s })
        ]));
        setTimeout(function () { fill.style.width = (r.s / maxS * 100) + "%"; }, 300 + k * 250);
      });
      frame([el("div", { class: "body" }, [
        el("div", { class: "crown pop", text: "👑" }),
        el("div", { class: "huge pop", style: "font-size:4.6vw", text: title }),
        el("div", { class: "happy fade", style: "margin:1.5vh 0 3vh", text: "Happy Birthday, " + vm.names.judge + "!" }),
        board
      ])]);
    }

    return { start: start };
  })();

  boot();
})();
</script>
